disallowed-methods = [
    { path = "willikins_types::sink::SinkToken::new", reason = "SinkToken may only be constructed by the apply executor in willikins-core; tests must opt in with #[allow(clippy::disallowed_methods)]" },
    { path = "secrecy::ExposeSecret::expose_secret", reason = "a provider credential's bytes may only be read by Credential::authorize/authorize_header in willikins-providers-http, a secret domain type's bytes only by the derive's own generated `expose`, a resolver-chain intermediate's bytes only by its own reveal_for_transform (OpaqueSecret's and, as the second such exception until doppler.secret.get migrates to emit OpaqueSecret, DopplerSecretValue's) -- the token-less exception for a pure transform/parse tool's Tool::read, which never receives a SinkToken -- and AppleSigningKey's bytes only by its own reveal_for_signing, the third and narrowest token-less exception, scoped to using the key as a credential to sign one JWT inside appstore.bundle_id.ensure/appstore.bundle_id_capability.ensure's own Tool::read, never to moving it anywhere; tests must opt in with #[allow(clippy::disallowed_methods)]" },
    { path = "secrecy::ExposeSecretMut::expose_secret_mut", reason = "secrecy 0.10's second way out of a SecretString (it returns &mut str); nothing in this workspace mutates a secret in place, so there is no allowed call site at all" },
    { path = "willikins_types::__private::conversion", reason = "only the conversions! macro's own expansion may build a Conversion row -- a hand-written call would carry any converter fn, bypassing the macro's compile-time secrecy-only-goes-up assertion at the call site; tests must opt in with #[allow(clippy::disallowed_methods)]" },
    { path = "willikins_types::registry::TypeRegistry::probe_conversion", reason = "only willikins-core's check may resolve a conversion, inside Resolver::check_with_port; plan and apply apply the one conversion check already recorded on a Checked edge and never look the table up again -- a tripwire test greps plan.rs, apply.rs and describe.rs for the method's name so an #[allow] smuggled into one of them still fails the gate; tests must opt in with #[allow(clippy::disallowed_methods)]" },
]
