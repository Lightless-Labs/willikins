[workspace]
resolver = "3"
members = [
  "crates/willikins-types",
  "crates/willikins-derive",
  "crates/willikins-core",
  "crates/willikins-dsl",
  "crates/willikins-tools",
  "crates/willikins-providers-fake",
  "crates/willikins-providers-http",
  "crates/willikins-providers-github",
  "crates/willikins-providers-doppler",
  "crates/willikins-providers-buildkite",
  "crates/willikins-providers-signoz",
  "crates/willikins-providers-appstore",
  "crates/willikins-journal",
  "crates/willikins-server",
  "crates/willikins-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Lightless-Labs/willikins"
authors = ["Lightless Labs"]

[workspace.dependencies]
willikins-types = { path = "crates/willikins-types" }
willikins-derive = { path = "crates/willikins-derive" }
willikins-core = { path = "crates/willikins-core" }
willikins-dsl = { path = "crates/willikins-dsl" }
willikins-tools = { path = "crates/willikins-tools" }
willikins-providers-fake = { path = "crates/willikins-providers-fake" }
willikins-providers-http = { path = "crates/willikins-providers-http" }
willikins-providers-github = { path = "crates/willikins-providers-github" }
willikins-providers-doppler = { path = "crates/willikins-providers-doppler" }
willikins-providers-buildkite = { path = "crates/willikins-providers-buildkite" }
willikins-providers-signoz = { path = "crates/willikins-providers-signoz" }
willikins-providers-appstore = { path = "crates/willikins-providers-appstore" }
willikins-journal = { path = "crates/willikins-journal" }
willikins-server = { path = "crates/willikins-server" }

chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = { version = "1.2", features = ["indexmap2"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"
petgraph = "0.8"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
regex = "1"
regex-syntax = "0.8"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

proptest = "1"
trybuild = "1"
insta = { version = "1", features = ["json", "yaml"] }
jsonschema = { version = "0.56", default-features = false }
saphyr-parser = "0.0.12"
uuid = { version = "1", features = ["v7", "std"] }
fd-lock = "4"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
rand = "0.9"
mockito = "1"
base64 = "0.23"
p256 = "0.13"
# The crypto backend is `rust_crypto`, not `aws_lc_rs`: this is already
# the only backend the workspace builds (milestone 2c, task 1). Since
# jsonwebtoken 10.0.0 it requires exactly one, and cargo unifies
# features across the workspace, so switching it is workspace-wide, not
# 2c-local -- it would re-test `apple_credential.rs` and `appstore.rs`
# on the other backend and need `g++` in the builder. `rsa` is already
# in the lock through `rust_crypto` (unconditionally; not new to 2c),
# which is RUSTSEC-2023-0071 (a private-key signing-timing leak):
# willikins never signs with the RSA family (decision 22 of the
# 2026-09-16 milestone 2c plan), which is the normative constraint
# that justifies ignoring it, now that a 2c issuer signs, rather than
# the delegating draft's voided "a resource server only verifies"
# claim.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
crypto_box = { version = "0.9", features = ["seal"] }
sha2 = "0.11"
rmcp = "3"
tokio = "1"
http = "1"
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["cookie-signed"] }
tower = "0.5"
tower-http = { version = "0.7", default-features = false }
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde_urlencoded = "0.7"
# Passkey enrollment and authentication (milestone 2c). Depends
# unconditionally on `openssl`/`openssl-sys` -- see the Dockerfile.
webauthn-rs = "0.5"
# Dev-only: drives the ceremonies in tests with no browser (`SoftPasskey`).
webauthn-authenticator-rs = "0.5"
# Hashes the stored recovery codes (milestone 2c, decision 24); not a
# password-only dependency.
argon2 = "0.6"
# PHC string encoding, direct dependency so a later parameter increase
# is a per-hash migration rather than a flag day. 0.6.0 is yanked.
password-hash = "0.6"
# The trusted-directory handle (milestone 2c, decision 25): a safe
# `openat(O_NOFOLLOW)` the workspace's `unsafe_code = "forbid"` rules out
# calling through `libc` directly. Already in the lock at 1.1.4 (through
# `fd-lock` and `tempfile`), so this adds no new crate to the build.
rustix = { version = "1", features = ["fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
debug = 1
