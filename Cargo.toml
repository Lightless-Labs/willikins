[workspace]
resolver = "3"
members = [
  "crates/willikins-types",
  "crates/willikins-derive",
  "crates/willikins-core",
  "crates/willikins-dsl",
  "crates/willikins-tools",
  "crates/willikins-providers-fake",
  "crates/willikins-providers-http",
  "crates/willikins-providers-github",
  "crates/willikins-providers-doppler",
  "crates/willikins-journal",
  "crates/willikins-server",
  "crates/willikins-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Lightless-Labs/willikins"
authors = ["Lightless Labs"]

[workspace.dependencies]
willikins-types = { path = "crates/willikins-types" }
willikins-derive = { path = "crates/willikins-derive" }
willikins-core = { path = "crates/willikins-core" }
willikins-dsl = { path = "crates/willikins-dsl" }
willikins-tools = { path = "crates/willikins-tools" }
willikins-providers-fake = { path = "crates/willikins-providers-fake" }
willikins-providers-http = { path = "crates/willikins-providers-http" }
willikins-providers-github = { path = "crates/willikins-providers-github" }
willikins-providers-doppler = { path = "crates/willikins-providers-doppler" }
willikins-journal = { path = "crates/willikins-journal" }
willikins-server = { path = "crates/willikins-server" }

chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = { version = "1.2", features = ["indexmap2"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = "2"
petgraph = "0.8"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
regex = "1"
regex-syntax = "0.8"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

proptest = "1"
trybuild = "1"
insta = { version = "1", features = ["json", "yaml"] }
jsonschema = { version = "0.56", default-features = false }
saphyr-parser = "0.0.12"
uuid = { version = "1", features = ["v7", "std"] }
fd-lock = "4"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
rand = "0.9"
mockito = "1"
base64 = "0.23"
crypto_box = { version = "0.9", features = ["seal"] }
sha2 = "0.11"
rmcp = "3"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
debug = 1
