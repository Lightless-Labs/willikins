[package]
name = "willikins-providers-fake"
description = "In-memory GitHub and Doppler tools for tests and the milestone 1 CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
willikins-types.workspace = true
willikins-core.workspace = true
willikins-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
# `willikins-core`'s generated-`Workflow` test helpers
# (`willikins_core::testing`), for `tests/convergence_property.rs`. This
# crate's own `[dependencies]` entry above stays feature-plain; only this
# dev-dependency asks for `test-support`, per
# `docs/plans/2026-09-12-milestone-2-providers-apply-mcp.md`'s task E
# ("never a core dev-dependency on the fake crate" — the direction runs
# the other way: the fake crate's dev-dependency on core).
willikins-core = { workspace = true, features = ["test-support"] }

