[package]
name = "willikins-providers-buildkite"
description = "Live Buildkite provider tools: buildkite.pipeline.ensure, buildkite.cluster.get, buildkite.pipeline.bootstrap.gate, buildkite.pipeline.bootstrap.ensure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Compiles `tests/live_write_cycle.rs`, and nothing else. Empty on
# purpose: it gates that one test target (see its `[[test]]` entry
# below), so a plain `cargo test --workspace` never builds a test that
# provisions a real Buildkite pipeline. The test is `#[ignore]`d and
# needs `WILLIKINS_LIVE_TESTS=1` on top of the feature before it makes a
# call. Mirrors `willikins-providers-doppler`'s own `live-tests` feature.
live-tests = []

[[test]]
name = "live_write_cycle"
required-features = ["live-tests"]

[[test]]
name = "live_bootstrap_cycle"
required-features = ["live-tests"]

# `tests/live_rollback_cycle.rs` (milestone 3m task L3): the one test
# target that exercises `buildkite.pipeline.ensure`'s inverse against the
# real sandbox org, creating, drifting (an unaccepted build, then an
# accepted one) and deleting three throwaway pipelines plus two
# throwaway builds (verify item 8). Same gating shape as
# `live_write_cycle` above.
[[test]]
name = "live_rollback_cycle"
required-features = ["live-tests"]

[dependencies]
willikins-core.workspace = true
willikins-types.workspace = true
willikins-providers-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
indexmap.workspace = true
regex.workspace = true
thiserror.workspace = true
# Milestone 3m task P4: `client::parse_pipeline_created_at` parses
# Buildkite's own non-RFC-3339 pipeline `created_at` form
# (`"<date> <time> UTC"`), which `willikins_core::Timestamp`'s strict
# RFC 3339 parser refuses outright. `willikins-providers-doppler` already
# carries this same workspace dependency for its own `created_at` tests.
chrono.workspace = true

[dev-dependencies]
willikins-providers-http = { workspace = true, features = ["test-support"] }
willikins-providers-fake.workspace = true
willikins-providers-github.workspace = true
willikins-providers-doppler.workspace = true
willikins-dsl.workspace = true
willikins-tools.workspace = true
mockito.workspace = true
insta.workspace = true
# A dev-only cycle back to `willikins-server`, exactly the shape
# `willikins-providers-doppler`'s own `Cargo.toml` documents: legal
# because dev-dependencies are never built when this crate is depended on
# as a library.
willikins-server.workspace = true

[lints]
workspace = true
