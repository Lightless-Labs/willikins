[package]
name = "willikins-server"
description = "The Butler: plan/approve/apply library core for the willikins MCP and CLI surfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
willikins-core.workspace = true
willikins-types.workspace = true
willikins-dsl.workspace = true
willikins-journal.workspace = true
willikins-tools.workspace = true
willikins-providers-fake.workspace = true
willikins-providers-http.workspace = true
willikins-providers-github.workspace = true
willikins-providers-doppler.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
indexmap.workspace = true
chrono.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync"] }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
rmcp = { workspace = true, features = ["client", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync"] }
# Enables `Credential::for_testing` for this crate's own tests (cargo
# unifies features across the build, so this reaches every target, the
# same gotcha `willikins-types`' own self dev-dependency documents).
willikins-providers-http = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
