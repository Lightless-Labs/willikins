[package]
name = "willikins-providers-doppler"
description = "Live Doppler provider tools: doppler.project.ensure, doppler.config.ensure, doppler.service_token.ensure, doppler.service_token.rotate, doppler.secret.get"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Compiles `tests/live_write_cycle.rs`, and nothing else. Empty on
# purpose: it gates that one test target (see its `[[test]]` entry below),
# so a plain `cargo test --workspace` never builds a test that provisions
# real Doppler projects. The test is `#[ignore]`d and needs
# `WILLIKINS_LIVE_TESTS=1` on top of the feature before it makes a call.
live-tests = []

[[test]]
name = "live_write_cycle"
required-features = ["live-tests"]

[dependencies]
willikins-core.workspace = true
willikins-types.workspace = true
willikins-providers-http.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
regex.workspace = true
thiserror.workspace = true

[dev-dependencies]
willikins-providers-http = { workspace = true, features = ["test-support"] }
willikins-providers-fake.workspace = true
willikins-providers-github.workspace = true
willikins-dsl.workspace = true
willikins-tools.workspace = true
mockito.workspace = true
insta.workspace = true
# A dev-only cycle back to `willikins-server` (which depends on this crate
# normally, to assemble the live catalog): legal because dev-dependencies
# are never built when this crate is depended on as a library, the same
# shape `willikins-types`' own self dev-dependency documents. Lets this
# test call `willikins_server::live_catalog_with` instead of keeping a
# second copy of the nine-tool assembly.
willikins-server.workspace = true

[lints]
workspace = true
