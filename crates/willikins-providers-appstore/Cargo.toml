[package]
name = "willikins-providers-appstore"
description = "Live App Store Connect provider tools: appstore.bundle_id.ensure, appstore.bundle_id_capability.ensure, appstore.certificate.get, appstore.profile.ensure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Compiles `tests/live_write_cycle.rs`, and nothing else -- mirrors
# `willikins-providers-buildkite`'s own `live-tests` feature exactly, for
# exactly the same reason: a plain `cargo test --workspace` must never
# provision or delete anything against the operator's live App Store
# Connect account. The test is `#[ignore]`d and needs
# `WILLIKINS_LIVE_TESTS=1` on top of the feature before it makes a call.
live-tests = []

[[test]]
name = "live_write_cycle"
required-features = ["live-tests"]

[dependencies]
willikins-core.workspace = true
willikins-types.workspace = true
willikins-providers-http.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# `appstore.certificate.get`'s own expiry check (milestone 3c): parses a
# certificate's `expirationDate` (RFC 3339) against the wall clock.
# Already a workspace dependency and in `Cargo.lock` (used by
# `willikins-types`' own `Description` and elsewhere) -- no new
# third-party crate enters the tree.
chrono.workspace = true

[dev-dependencies]
base64.workspace = true
regex.workspace = true
# `tests/live_write_cycle.rs`'s own duplicate-name probe (decision (h)
# step 6) needs one raw request outside `willikins-providers-http`'s
# typed client: that client deliberately never parses a provider error's
# body (every other call site in this workspace relies on that), but this
# one diagnostic step's whole point is to read the response's own
# `errors[].code` leaf. Already a workspace dependency (this crate's own
# `willikins-providers-http` dependency uses it internally) -- no new
# third-party crate enters the tree.
ureq.workspace = true
willikins-providers-http = { workspace = true, features = ["test-support"] }
willikins-providers-fake.workspace = true
willikins-dsl.workspace = true
willikins-tools.workspace = true
willikins-providers-doppler.workspace = true
mockito.workspace = true
insta.workspace = true
# A dev-only cycle back to `willikins-server`, exactly the shape
# `willikins-providers-buildkite`'s own `Cargo.toml` documents: legal
# because dev-dependencies are never built when this crate is depended on
# as a library.
willikins-server.workspace = true

[lints]
workspace = true
