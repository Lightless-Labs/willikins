[package]
name = "willikins-cli"
description = "The willikins command line: validate, describe, plan, schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "willikins"
path = "src/main.rs"

[features]
# Compiles `tests/live_smoke.rs`, and nothing else. Empty on purpose: it
# gates that one test target (see its `[[test]]` entry below), so a plain
# `cargo test --workspace` never builds the test that provisions a real
# GitHub repository and a real Doppler project. The test is `#[ignore]`d
# and needs `WILLIKINS_LIVE_TESTS=1` on top of the feature before it
# makes a call. Mirrors `willikins-providers-doppler`'s own `live-tests`.
live-tests = []

[[test]]
name = "live_smoke"
required-features = ["live-tests"]

[dependencies]
willikins-types.workspace = true
willikins-core.workspace = true
willikins-dsl.workspace = true
willikins-providers-fake.workspace = true
# Task 11: `apply`, `approve`, `reject`, `runs`, `run`, and `serve` (which
# re-exports `willikins-server`'s own `cli::run_serve`) all drive
# `willikins_server::Butler` directly, and `serve` needs
# `willikins_server::cli::{ServeArgs, run_serve}` -- so this is now an
# ordinary runtime dependency, not only a dev one for the parity tests.
# `willikins-server` never depends on this crate, so there is still no
# cycle; this does pull `rmcp`, `axum`, and `tokio` transitively into the
# CLI's own build, which the handoff already flagged as making the first
# build of this crate long.
willikins-server.workspace = true
# `apply`/`approve`/`reject`/`runs`/`run` need `FileJournal`,
# `MemoryJournal`, `PrincipalId`, `Reason`, and the read-only `replay`
# directly, not only through `willikins-server`'s own re-exports.
willikins-journal.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `apply <file>` copies the one named document into a private temporary
# directory (see `main.rs`'s own docs on why) rather than pointing a
# `Butler` at the file's own parent, which may hold sibling fixtures that
# do not even parse.
tempfile.workspace = true

[dev-dependencies]
indexmap.workspace = true
# Task 14's live smoke test reads the Doppler project back after the
# teardown script has run, through the same client the provider uses --
# an independent leftover check, not the script's own word for it. Only
# a dev-dependency: the CLI itself reaches Doppler through
# `willikins-server`'s live catalog, never directly.
willikins-providers-doppler.workspace = true
# The same test's GitHub pre-flight and leftover check read the
# repository through the sandbox PAT directly (the same credential and
# client `deploy/teardown.sh` authenticates with), never through `gh`.
willikins-providers-github.workspace = true
willikins-providers-http.workspace = true
proptest.workspace = true
serde_yaml_ng.workspace = true
# The MCP half of acceptance test 11: an in-process rmcp client over a
# duplex pair against `willikins_server::WillikinsHandler`.
rmcp = { workspace = true, features = ["client", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync"] }

[lints]
workspace = true
