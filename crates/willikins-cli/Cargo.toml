[package]
name = "willikins-cli"
description = "The willikins command line: validate, describe, plan, schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "willikins"
path = "src/main.rs"

[dependencies]
willikins-types.workspace = true
willikins-core.workspace = true
willikins-dsl.workspace = true
willikins-providers-fake.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
indexmap.workspace = true
proptest.workspace = true
serde_yaml_ng.workspace = true
# Acceptance test 11's library half: the parity test drives the built
# `willikins` binary and `willikins_server::Butler` side by side and
# compares their JSON. `willikins-server` never depends on this crate, so
# this is an ordinary (one-directional) dev-dependency, not a cycle.
willikins-server.workspace = true
willikins-journal.workspace = true
# The MCP half of acceptance test 11: an in-process rmcp client over a
# duplex pair against `willikins_server::WillikinsHandler`.
rmcp = { workspace = true, features = ["client", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync"] }

[lints]
workspace = true
