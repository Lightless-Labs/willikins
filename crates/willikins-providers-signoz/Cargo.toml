[package]
name = "willikins-providers-signoz"
description = "Live SigNoz provider tools: signoz.ingestion_key.ensure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Compiles `tests/live_write_cycle.rs`, and nothing else. Empty on
# purpose: it gates that one test target, so a plain `cargo test
# --workspace` never builds a test that mints and deletes real SigNoz
# ingestion keys against the operator's production account. The test is
# `#[ignore]`d and needs `WILLIKINS_LIVE_TESTS=1` on top of the feature
# before it makes a call. Mirrors `willikins-providers-buildkite`'s and
# `willikins-providers-doppler`'s own `live-tests` feature.
live-tests = []

[[test]]
name = "live_write_cycle"
required-features = ["live-tests"]

[dependencies]
willikins-core.workspace = true
willikins-types.workspace = true
willikins-providers-http.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
regex.workspace = true
thiserror.workspace = true

[dev-dependencies]
willikins-providers-http = { workspace = true, features = ["test-support"] }
willikins-providers-fake.workspace = true
mockito.workspace = true
insta.workspace = true
# Only the live write cycle uses this, to name its own throwaway key
# `willikins-<random>-delete-me` rather than a fixed literal a leftover
# from an aborted run could collide with a name a human later reuses.
rand.workspace = true

[lints]
workspace = true
