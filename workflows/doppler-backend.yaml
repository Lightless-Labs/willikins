# Gives an EXISTING Doppler project (from doppler-project.yaml, or any
# project already named the way this document expects) what a backend
# needs: each environment's root config inherits the workplace's shared
# backend base config(s), via Doppler config inheritance -- a reference,
# not a copy, so rotating a shared key propagates to every inheriting
# project without this workflow running again.
#
# Same shape as doppler-ios.yaml, for a different policy; see that
# document's header for why `base_configs` is an ordinary overridable
# input carrying a fixed default rather than a true literal, and why
# `configs` re-derives (never re-creates a second time) each
# environment's root config.
#
# What the operator must have created by hand first: the Doppler project
# named by `project` (typically with doppler-project.yaml), and the
# shared backend base config(s) named in `base_configs`' default below --
# filled in and marked inheritable (via the Doppler dashboard, or a
# separate run of `doppler.config.inheritable.ensure` -- no document
# here calls it). This document only ever reads from them,
# never writes to them.
name: doppler-backend
description: Make an existing Doppler project's configs inherit the shared backend base config(s).
inputs:
  project: { type: DopplerProject, description: Existing Doppler project (e.g. from doppler-project) }
  environments: { type: list<EnvironmentSlug>, default: [dev, stg, prd] }
  base_configs: { type: list<DopplerConfig>, default: [lightless-labs-shared/backend_base], description: Fixed by this document -- edit the default to your workplace's shared backend base config(s). }
steps:
  configs:
    tool: doppler.config.ensure
    for_each: ${{ inputs.environments }}
    with:
      project: ${{ inputs.project }}
      environment: ${{ item }}
  inherit:
    tool: doppler.config.inherits.ensure
    for_each: ${{ steps.configs.config }}
    with:
      config: ${{ item }}
      inherits: ${{ inputs.base_configs }}
outputs:
  project: ${{ inputs.project }}
