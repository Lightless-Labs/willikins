# Gives an EXISTING Doppler project (from doppler-project.yaml, or any
# project already named the way this document expects) what an iOS
# project needs: each environment's root config inherits the workplace's
# shared iOS base config(s), via Doppler config inheritance -- a
# reference, not a copy, so rotating a shared key propagates to every
# inheriting project without this workflow running again.
#
# `base_configs`' default below is this document's actual policy: which
# base configs an iOS project needs. That is deliberately not something
# an operator is meant to pass at run time -- the operator's own
# instruction is that the references are hardcoded here, edited here,
# never threaded through per run. It is still, mechanically, an ordinary
# overridable input: the document format has no syntax to bind a list
# literal directly to a `with:` port at all (a `with:` value is always a
# single string, and `check` refuses a plain string bound to a
# list-typed port outright -- see `fixtures/inherits-literal-list.yaml`),
# and no tool in this catalog turns a literal `DopplerConfig` into an
# output without also taking an action against it, so a defaulted input
# is the only way to express a fixed list today. Treat the `default:`
# below as this document's actual policy; its overridability is a gap in
# the document format, not an invitation.
#
# `configs` re-derives, never re-creates a second time (`ensure` is
# idempotent), each environment's root config identity: no tool in this
# catalog turns a project and an environment into a `DopplerConfig`
# without also ensuring it exists, the same move `workflows/rotate-service-token.yaml`
# already makes for the same reason. Passing a different `environments`
# list than `doppler-project.yaml` used for this project creates root
# configs here that document never made.
#
# What the operator must have created by hand first: the Doppler project
# named by `project` (typically with doppler-project.yaml), and the
# shared iOS base config(s) named in `base_configs`' default below --
# filled in and marked inheritable (via the Doppler dashboard, or a
# separate run of `doppler.config.inheritable.ensure` -- no document
# here calls it). This document only ever reads from them,
# never writes to them.
name: doppler-ios
description: Make an existing Doppler project's configs inherit the shared iOS base config(s).
inputs:
  project: { type: DopplerProject, description: Existing Doppler project (e.g. from doppler-project) }
  environments: { type: list<EnvironmentSlug>, default: [dev, stg, prd] }
  base_configs: { type: list<DopplerConfig>, default: [lightless-labs-shared/ios_base], description: Fixed by this document -- edit the default to your workplace's shared iOS base config(s). }
steps:
  configs:
    tool: doppler.config.ensure
    for_each: ${{ inputs.environments }}
    with:
      project: ${{ inputs.project }}
      environment: ${{ item }}
  inherit:
    tool: doppler.config.inherits.ensure
    for_each: ${{ steps.configs.config }}
    with:
      config: ${{ item }}
      inherits: ${{ inputs.base_configs }}
outputs:
  project: ${{ inputs.project }}
