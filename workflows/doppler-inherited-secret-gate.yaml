# Milestone 3j, task C2 (decision (c5); acceptance 10): the tracked proof
# of the shape the operator's own (gitignored) iOS app document uses for
# its APNs key -- a named secret observed in a Doppler config after
# inheritance is set, rather than taken on the operator's acknowledgement
# ("It shouldn't. It should check.").
#
# The shape: `names` (`naming.v1`) derives the project; `doppler`
# (`doppler.project.ensure`) creates it; `prd_config`
# (`doppler.branch_config.ensure`) creates the one branch config under
# `prd` that inherits a shared base config. `base_config_gate`
# (`doppler.config.inheritable.gate`, one instance per entry of
# `base_configs`) checks that each base exists and is inheritable before
# `inherit` (`doppler.config.inherits.ensure`) ever names it -- the same
# gate-before-write shape the operator's own (gitignored) iOS app
# document uses for its own real base configs. `apns_key`
# (`doppler.secret_name.gate`) then checks that the named secret is
# visible on `prd_config` once inheritance is set, binding its own
# `config` from `${{ steps.inherit.config }}` (milestone 3j, task C1's
# pass-through) rather than from `prd_config` directly, so the gate is
# ordered after inheritance, not merely alongside it.
#
# Two runs, not a bug: on a fresh run `inherit` plans `Create` (nothing
# inherits the base config yet), and `apns_key`'s own `read` -- which
# happens at plan time, before `inherit`'s write ever applies -- finds
# the secret not yet visible, so `apns_key` plans `Blocked`. The run
# reports it, with the gate's own `how` saying to re-run. Applying once
# and re-running resolves it: `inherit` now reads `NoOp` and `apns_key`
# reads the secret through the inheritance that run 1 just set,
# `Compute`. This is the same idempotent "re-running is the resume" every
# other gated document in this catalog already relies on.
#
# What the operator must have created by hand first: the shared base
# config(s) named in `base_configs`' default below, filled in with the
# secret and marked inheritable (via the Doppler dashboard, or a
# separate run of `doppler.config.inheritable.ensure` -- no document here
# calls it). This document only ever reads from them, never writes to
# them.
name: doppler-inherited-secret-gate
description: Observe a named secret's visibility in a Doppler config, through inheritance, instead of taking an operator's word for it.
inputs:
  base_configs: { type: list<DopplerConfig>, default: [shared_keys/prd], description: "The shared base config(s) holding the secret. Fixed by this document -- edit the default to your own workplace's shared base config." }
steps:
  names:
    tool: naming.v1
    with:
      org: example-org
      slug: third-thoughts
  doppler:
    tool: doppler.project.ensure
    with:
      project: ${{ steps.names.doppler_project }}
  prd_config:
    tool: doppler.branch_config.ensure
    with:
      project: ${{ steps.doppler.project }}
      environment: prd
      branch: deploy
  base_config_gate:
    tool: doppler.config.inheritable.gate
    for_each: ${{ inputs.base_configs }}
    with:
      config: ${{ item }}
  inherit:
    tool: doppler.config.inherits.ensure
    with:
      config: ${{ steps.prd_config.config }}
      inherits: ${{ steps.base_config_gate.config }}
  apns_key:
    tool: doppler.secret_name.gate
    with:
      config: ${{ steps.inherit.config }}
      name: EXAMPLE_APNS_KEY
outputs:
  project: ${{ steps.doppler.project }}
