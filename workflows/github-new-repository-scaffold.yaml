# Milestone 3l, task D1 (docs/plans/2026-10-05-milestone-3l-new-repositories.md),
# SHARED VALUES "Tracked document (D1)": the tracked proof that a document
# can create a brand-new (or still-empty) GitHub repository and scaffold it
# in the same run -- decisions (a) and (b) of that plan, end to end over the
# real catalog. Pinned by
# crates/willikins-cli/tests/it/new_repository_scaffold_document.rs.
name: github-new-repository-scaffold
description: Create a GitHub repository if needed and scaffold it with a starter file set.
inputs:
  repo: { type: GitHubRepo, description: "The repository to create and scaffold" }
  visibility: { type: RepoVisibility, default: private }
steps:
  repo:
    tool: github.repo.ensure
    with:
      repo: ${{ inputs.repo }}
      visibility: ${{ inputs.visibility }}
  editorconfig_file:
    tool: repo.file.render
    with:
      path: .editorconfig
      template: "root = true\n"
  readme_file:
    tool: repo.file.render
    with:
      path: README.md
      template: "# Scaffolded by willikins\n"
  scaffold:
    tool: github.scaffold.ensure
    with:
      repo: ${{ steps.repo.repo }}
      branch: main
      marker: .willikins-scaffold
      files:
        - ${{ steps.editorconfig_file.file }}
        - ${{ steps.readme_file.file }}
      message: "chore: scaffold the repository"
outputs:
  repo_url: ${{ steps.repo.url }}
