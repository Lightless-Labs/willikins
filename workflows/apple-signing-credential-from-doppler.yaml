# The operator's own chain: all three parts of the App Store Connect
# credential resolved out of their sandbox Doppler workplace, project
# `app-store-connect`, config `prd` -- ASC_API_KEY_ISSUER_ID and
# ASC_API_KEY_ID as plain Doppler variables (read through
# `doppler.value.get`, never `doppler.secret.get`: choosing that tool over
# this one is the declaration that these two are not secrets), and
# ASC_API_KEY_BASE64 -- the private key, base64-wrapped, which is THIS
# OPERATOR'S habit and not a standard -- decoded and parsed in two
# separate steps rather than one forgiving parser.
#
# This document is one half of the proof that the credential's three parts
# are genuinely free ports, not something bundled: see
# apple-signing-credential-from-inputs.yaml for the other half, where the
# two ids arrive as plain workflow inputs instead and the key is read from
# a bare environment variable with no base64 layer.
#
# There is no Apple tool in this workspace yet to hand the three resolved
# parts to (milestone 5) -- this document stops at resolving and exposing
# them, which is exactly what `check`/`plan` need to prove the chain
# types.
name: apple-signing-credential-from-doppler
description: Resolve the App Store Connect credential's three parts from Doppler, the operator's own way.
inputs:
  config: { type: DopplerConfig, description: "Doppler config holding the credential, e.g. app-store-connect/prd" }
steps:
  issuer_id:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_ISSUER_ID
  key_id:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_ID
  key_base64:
    tool: doppler.secret.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_BASE64
  key_decoded:
    tool: base64.decode
    with:
      value: ${{ steps.key_base64.value }}
  key:
    tool: apple.signing_key.parse
    with:
      value: ${{ steps.key_decoded.value }}
outputs:
  issuer_id: ${{ steps.issuer_id.value }}
  key_id: ${{ steps.key_id.value }}
