# Milestone 3e, task 3: one document provisions everything a provider API
# can provision for Walter, the operator's iOS health app -- the app, a
# notification service extension (`.nse`) and a widgets extension
# (`.widgets`), no watchOS app for now. It lives in the existing
# Bande-a-Bonnot monorepo (`Bande-a-Bonnot/monorepo`), referenced through
# `github.repo.get`, never created.
#
# The operator's real identifiers (never a default -- trust boundary 2 of
# `docs/plans/2026-09-27-milestone-3e-new-ios-app.md`):
#   com.bande-a-bonnot.walter
#   com.bande-a-bonnot.walter.nse
#   com.bande-a-bonnot.walter.widgets
# following the account's existing suffix habit (`.nse`, `.keyboard`,
# `.stickers`). A dry run instead passes three throwaway identifiers under
# `com.willikins.probe.delete-me.<unique>`.
#
# **Platform is the literal `UNIVERSAL` (2026-09-30 addendum, fact 1), not
# a caller input.** The first real apply of this document created all
# three identifiers as `IOS` (the document's own former default); after
# the operator restored the app record and configured App Groups in the
# portal, all three read `platform: UNIVERSAL` -- and so do all 21 of the
# operator's other bundle ids on this account. A live re-run then refused
# at plan time (`app_id.platform`: the resource is ours, but its current
# value does not match what was requested, and this tool will not change
# it -- `platform` is immutable through the API, per
# `AppleBundleIdPlatform`'s own doc). So `IOS` was a permanent trap on
# this account: every `*_id.platform` below is now the bare literal
# `UNIVERSAL`, and `platform` is no longer a declared input at all --
# there is nothing left for a caller to override.
#
# What this document CANNOT automate, per the pre-flight checklist, becomes
# either an *observed gate* (this document reads the real state and blocks
# until it is true) or an *acknowledgement gate* (no API exposes the state,
# so the document waits for the operator's own `done`) -- decision (j),
# "a manual step is a gate: blocked, not failed; re-running the document is
# the resume". Every node is idempotent, so re-running this same document
# once a gate's `need` is met is the whole resume story; nothing here saves
# run state.
#
#   - M1, the App Store Connect app record: `app_record`, a LEAF gate over
#     `appstore.app.get` (`GET /v1/apps`) -- no API can create an app
#     record at all (research note, section 4), so nothing in this
#     document is ordered by it; it blocks the run and is reported, but
#     holds nothing back.
#   - M2, `APP_GROUPS` enabled and the group assigned on all three
#     identifiers: `app_app_groups` / `nse_app_groups` / `widgets_app_groups`,
#     one `appstore.app_group.gate` per identifier. Each passes `identifier`
#     through as its own output, and each profile node below binds `name`
#     from *its own* gate's output, never from the registration node
#     directly -- that data edge is what orders the profile after the
#     gate. The API only shows the flag *enabled*, never the group
#     actually *assigned* (pre-flight row 14), so this gate can pass
#     before the operator finishes the portal-side assignment; a profile
#     minted at that point is one Apple will invalidate, and the *next*
#     run of this same document replaces it (`appstore.profile.ensure`'s
#     replace-when-INVALID, operator decision 1). So the flow is: run
#     this document; assign the app group by hand (M2); run the SAME
#     document again, which replaces the profiles Apple invalidated.
#   - M2b (2026-09-30 addendum, the App Attest gate task), the host
#     identifier's App Attest capability: `app_app_attest`, one
#     `appstore.bundle_id_capability.gate` over `APP_ATTEST`, host
#     identifier only -- Apple's own docs say `generateKey` fails from an
#     app extension regardless of `isSupported`, so the NSE and widgets
#     extensions get no such gate. The API can only ever *read* this
#     capability, never write it (a live `POST` on either
#     `APP_ATTEST`/`APP_ATTEST_OPT_IN` answers `409
#     ENTITY_ERROR.ATTRIBUTE.TYPE`) -- so, exactly like M2, this is a pure
#     observed gate the operator satisfies by hand in the portal
#     (Configure) or Xcode's Signing & Capabilities. `app_profile` (the
#     host app's profile only) binds `identifier` from this gate's own
#     output, so it is held back until App Attest is confirmed enabled,
#     the same "gate passes through the key it checked" shape M2 uses,
#     applied through a second, independent port of the same node.
#   - M5 (an APNs key), M6 (the CI Doppler grant): two `operator.acknowledge`
#     leaves, `m5_apns_key_done` / `m6_ci_doppler_access_done`. Neither has
#     a typed pass-through (decision (j), point 6's own honest limit), so
#     each is a leaf: it blocks the run's outcome and is reported, but
#     orders nothing else in this graph. M3 and M7 used to be two more
#     leaves here -- see milestone 3g, below, for why they are gone.
#   - M4 (minting the three profiles) is no longer manual: operator
#     decision 1 put the profiles in this document, behind M2's gates.
#   - M0 (confirming the shared base config names) is gone: operator
#     decision 2 names the real configs below, not a placeholder.
#
# **Superseded 2026-09-29 (milestone 3e task B1).** The KNOWN GAP this
# comment used to record -- "no tool can create a named branch Doppler
# config, so this document approximates by making every root config
# inherit the three base configs" -- is closed: `doppler.branch_config.ensure`
# now exists (`crates/willikins-providers-doppler/src/tools/branch_config_ensure.rs`),
# and `prd_config` below creates the operator's real, single
# `prd_deployment_ios` branch config, which alone inherits the three base
# configs. `dev`/`stg`/`prd` are now plain root configs with no
# inheritance, exactly as operator decision 2 asked -- `dev`/`stg` no
# longer gain the deployment credentials the old approximation leaked to
# them.
#
# SigNoz: nothing in this document calls it. Decision 2's "the SigNoz key
# into Doppler" is satisfied by Doppler's own config inheritance from
# `open-telemetry/prd_signoz`, one of the three base configs below --
# willikins never reads or writes the key itself.
#
# VERIFY ITEM 12, settled (R1, 2026-09-29): a live probe against the
# sandbox workplace found Doppler accepts a config literally named
# `bande-a-bonnot`, hyphenated, exactly as operator decision 2 wrote it --
# `DopplerConfigName`'s grammar widened to accept the hyphen rather than
# this document needing to guess an underscored substitute. `base_configs`
# below names the real config directly, `github/bande-a-bonnot`.
#
# **R4 (2026-09-29, this task): the real layout, edited in place.** The
# App Store Connect credential is no longer read from a caller-supplied
# `config` input: this document now reads it directly from
# `appstore-connect/deploy_ios`, one of the operator's real shared base
# configs (decision 2), under `APP_STORE_CONNECT_API_KEY_ISSUER_ID`,
# `APP_STORE_CONNECT_API_KEY_ID` and `APP_STORE_CONNECT_API_KEY_BASE64` --
# the real workplace's own names for those three secrets, not the
# `ASC_API_KEY_*` names this document used before this task. The GitHub
# token is resolved from Doppler the same way, mirroring R2's
# `workflows/github-repo-token-from-doppler.yaml` exactly: `gh_token_secret`
# (`doppler.secret.get` against `github/bande-a-bonnot`, `GH_CLONE_TOKEN`)
# into `gh_token` (`github.token.parse`), bound to `monorepo_ref`'s own
# optional `token` port -- so the monorepo reference authenticates as the
# project's own Doppler-held credential, never a bare
# `WILLIKINS_GITHUB_TOKEN` from the process environment (R2's own stated
# gap still applies: the live server still reads that variable from the
# process whenever *any* `github.*` tool is named in a document, so it
# must still be set in the process environment for a live run of this
# document even though this graph no longer needs it to resolve).
#
# **Sandbox naming gap, not fixed here.** The sandbox Doppler workplace's
# App Store Connect config still names these three secrets
# `ASC_API_KEY_ISSUER_ID` / `ASC_API_KEY_ID` / `ASC_API_KEY_BASE64` (this
# document's own names before this task) -- so a sandbox `plan`/`apply` of
# this document will not find `APP_STORE_CONNECT_API_KEY_*` under
# whatever config the sandbox calls `appstore-connect/deploy_ios`, and
# will fail with `NotFound` at `issuer_id_text` unless the sandbox
# workplace is reseeded under the real names first. This document is
# written for the real workplace's own naming now, not the sandbox's.
#
# **D1 (2026-09-30): the base-config gate is wired in, and `org`/`slug`/
# `monorepo` are true literals.** `base_config_gate` (`doppler.config.inheritable.gate`,
# `for_each: ${{ inputs.base_configs }}`) now sits ahead of `inherit`:
# `inherit.inherits` binds the aggregate of all three instances
# (`${{ steps.base_config_gate.config }}`), not `${{ inputs.base_configs }}`
# directly, so a base config that is missing or not yet marked inheritable
# blocks its own gate instance at plan time and `inherit` itself plans
# `Skip` -- never a mid-apply failure after `doppler`/`configs`/`prd_config`
# have already written (closing R3's own carried-forward "remaining").
# Nothing binds from `inherit`, so a blocked base config holds it back alone.
# `org` (`Bande-a-Bonnot`), `slug` (`walter`) and `monorepo`
# (`Bande-a-Bonnot/monorepo`) are no longer caller-overridable inputs --
# the operator's own words, "Just update the doc": each is now a bare
# literal at its one use site (`names.org`/`names.slug`,
# `monorepo_ref.repo`). `base_configs` itself stays a defaulted input, not
# a literal -- milestone 3g's list-binding syntax (`Binding::List`) could
# bind it to the `with:` port directly, but `for_each` must always be a
# reference, never a literal sequence (`doppler-ios.yaml`'s own header
# makes the identical point), so `base_configs` stays an ordinary,
# defaulted input regardless; its `default:` is this document's actual
# policy.
#
# **D2 (2026-09-30): the Buildkite credential is resolved from Doppler,
# and `buildkite_org`/`cluster` become literals.** Mirrors R4's own
# GitHub chain exactly: `bk_token_secret` (`doppler.secret.get` against
# `buildkite/prd`, `PIPELINE_CREATION_TOKEN` -- the real workplace's own
# secret, task brief) into `bk_token` (`buildkite.token.parse`), bound to
# both `buildkite_cluster.token` and `pipeline.token` (K1's optional
# port), so the pipeline chain authenticates as the project's own
# Doppler-held credential, never `WILLIKINS_BUILDKITE_TOKEN` from the
# process environment. `buildkite_org` and `cluster` are no longer
# caller-overridable inputs -- the same "Just update the doc" the D1
# addendum already applied to `org`/`slug`/`monorepo`: each is now a bare
# literal at its one use site, `la-bande-a-bonnot` (the real Buildkite
# org slug) and `Default cluster` (the real org's only cluster, both
# probed read-only 2026-09-29). **R4's own "must still be set in the
# process environment" claim above was about `WILLIKINS_GITHUB_TOKEN`,
# and L1 (2026-09-30) already superseded it for GitHub: this task
# extends the same relief to Buildkite. `live_catalog_for_document` now
# demands `WILLIKINS_BUILDKITE_TOKEN` only when some `buildkite.*` node
# leaves `token` unbound, and after this task neither one does, so `plan
# workflows/walter-ios-app.yaml --live` / `apply ... --live` need neither
# `WILLIKINS_GITHUB_TOKEN` nor `WILLIKINS_BUILDKITE_TOKEN` -- only
# `WILLIKINS_DOPPLER_TOKEN` (`serve` and `apply --plan-id --live` are
# untouched by L1 and still require both unconditionally at startup).**
#
# **T4 (2026-09-30, the App Attest gate task): platform is now the literal
# `UNIVERSAL` (fact 1, above), and the host app's profile is held back by
# a second gate, `app_app_attest`.** The operator asked for App Attest
# "enabled on apps by default"; the API can only read the capability, not
# write it (fact 2 -- a live `POST` of `APP_ATTEST` or
# `APP_ATTEST_OPT_IN` on a throwaway identifier answers `409
# ENTITY_ERROR.ATTRIBUTE.TYPE`, and neither is in Apple's own 28-member
# `CapabilityType` enum at all), so the honest answer is a gate exactly
# like M2's own `app_group.gate`: this document requires App Attest on
# the host identifier, observes it through the new, generalized
# `appstore.bundle_id_capability.gate` (which admits any
# `AppleObservableCapabilityType`, not only `APP_GROUPS`), and blocks with
# a readable need and how when it is missing. Enabling a capability
# changes the App ID and invalidates profiles minted before it
# (`appstore.profile.ensure`'s own replace-when-INVALID heals this on the
# next run, exactly as M2 already relies on), so the gate holds back the
# host app's profile the same way M2's own gate does. The NSE and widgets extensions are
# unaffected: Apple's own docs state `generateKey` fails when called from
# an app extension regardless of `isSupported`, so App Attest is never
# requested on either extension identifier, and their profiles keep
# binding through their own `app_group.gate` alone, unchanged by this
# task. `app_app_attest` reads from `app_id.identifier` directly (not
# chained through `app_app_groups`), so a fresh run reports both gates'
# needs together rather than one only after the other is already met.
#
# **W1 (2026-09-30, milestone 3g): M3 and M7 stop being acknowledgements.**
# The operator's own decision: "We'll add file capabilities, update the
# document with them, and use willikins' idempotency to run that."
#   - **M3 (repo files) is now real writes.** Seventeen `repo.file.render`
#     nodes (task T1) render Walter's files -- `BUILD.bazel` (an
#     `ios_application` embedding two `ios_extension`s, `local_provisioning_profile`s
#     named after the three bundle identifiers, no `team_id` -- decision
#     (j), the account's own permanent-trap lesson from fact 1 above
#     applies equally to a Bazel rule this workspace cannot observe),
#     three entitlements files, both extensions' `Info.plist`s, the host
#     `Info.plist` (HealthKit usage strings), a privacy manifest, and
#     `.buildkite/` (the real pipeline graph, the upload script, provider
#     triggers disabled, and this document's own copy of the pipeline's
#     intended stored bootstrap). Every placeholder is `{{ N }}`, and the
#     only values ever substituted are the three bundle identifiers,
#     converted from `AppleBundleIdentifier` -- never a `Text`, never a
#     caller-controlled string (decision (e)). `walter_files`
#     (`github.scaffold.ensure`, task G2) lands all seventeen renders plus
#     an ownership marker (`apps/walter/.willikins-scaffold`) as **one
#     commit** on `main` (decision (f): the monorepo's own owner ruling is
#     trunk-based, "commit directly to `main`"), keyed by
#     `(repo, branch, marker)` so a re-run converges without re-reading or
#     re-writing a single seeded file (decision (c)). Its write
#     credential is new and narrow (decision (l)): `gh_write_token_secret`
#     (`doppler.secret.get` against `github/bande-a-bonnot_willikins`, a
#     branch config no other app config inherits, `GH_CONTENTS_WRITE_TOKEN`)
#     into `gh_write_token` (`github.token.parse`), bound to
#     `walter_files.token` alone -- `monorepo_ref` keeps reading with the
#     older, narrower `gh_token` (Contents: read only), so the read-only
#     reference to the repository and the write into it authenticate as
#     two different credentials on purpose.
#   - **`pipeline.repo` is rebound from `monorepo_ref.repo` to
#     `walter_files.repo`**, so the Buildkite pipeline is created only
#     after its own `.buildkite/` files exist on the branch (the
#     milestone's own survey: "The graph today provisions a pipeline that
#     cannot run"). On a first run `walter_files` plans `Create` with
#     `repo` predicted, so the pipeline still plans the same run.
#   - **M7 (the stored bootstrap) is now an observed gate**, not an
#     acknowledgement: `bootstrap_gate` (`buildkite.pipeline.bootstrap.gate`,
#     task B1) reads the pipeline's stored `configuration` and compares it,
#     structurally as YAML, against the bootstrap this document renders
#     (`bootstrap_yml.file`) -- equal is `Compute`, anything else
#     (different, unparsable, missing, or the pipeline itself absent) is
#     `Blocked` with a need/how telling the operator to paste the rendered
#     file into the pipeline's Settings -> Steps page by hand (decision
#     (h): writing a pipeline's executed configuration is not automatable
#     without breaking milestone 3a decision (a), so only the *check*
#     becomes a gate). `m3_repo_files_done` and `m7_bootstrap_done` are
#     gone from `inputs:` entirely -- there is nothing left for either to
#     acknowledge.
#   - **`data_protection` is now a bare literal**, not a caller-overridable
#     input -- the same "Just update the doc" D1/D2 already applied
#     elsewhere. Its value and `Walter.entitlements`' own
#     `com.apple.developer.default-data-protection` entry name the same
#     Apple data-protection class (`PROTECTED_UNTIL_FIRST_USER_AUTH` /
#     `NSFileProtectionCompleteUntilFirstUserAuthentication`); a Walter
#     document test pins both together so they cannot drift apart through
#     a caller's input that no longer exists.
name: walter-ios-app
description: Provision Walter (app, NSE, widgets) end to end -- bundle identifiers, capabilities, signing profiles, the monorepo reference, Doppler, the Buildkite pipeline, and its scaffold files -- reporting every manual step as a gate.
inputs:
  app_identifier: { type: AppleBundleIdentifier, description: "The app's bundle identifier, e.g. com.bande-a-bonnot.walter -- no default (trust boundary 2)" }
  nse_identifier: { type: AppleBundleIdentifier, description: "The notification service extension's bundle identifier, e.g. com.bande-a-bonnot.walter.nse" }
  widgets_identifier: { type: AppleBundleIdentifier, description: "The widgets extension's bundle identifier, e.g. com.bande-a-bonnot.walter.widgets" }
  certificate_type: { type: AppleCertificateType, description: "DISTRIBUTION or IOS_DISTRIBUTION" }
  serial_number: { type: AppleCertificateSerial, description: "The distribution certificate's serial number every profile below is signed with" }
  environments: { type: list<EnvironmentSlug>, default: [dev, stg, prd] }
  base_configs: { type: list<DopplerConfig>, default: [appstore-connect/deploy_ios, github/bande-a-bonnot, open-telemetry/prd_signoz], description: "Operator decision 2's real shared base configs, inherited by prd_config alone (task B1). This default IS the document's policy (D1) -- edited here, never threaded through per run; it stays an ordinary overridable input only because for_each must always bind a reference, never a literal sequence (milestone 3g's Binding::List could bind the with: port directly, but not for_each). Each entry is gated by base_config_gate below before inherit ever names it." }
  m5_apns_key_done: { type: OperatorAcknowledgement, description: "M5: the team's APNs auth key (.p8) is confirmed in a shared base config Walter inherits, or freshly created if none exists." }
  m6_ci_doppler_access_done: { type: OperatorAcknowledgement, description: "M6: the Buildkite CI Doppler service account has been granted read access to project walter." }
steps:
  # --- The App Store Connect credential, resolved from Doppler (the same
  # seven-node chain as appstore-bundle-id-from-doppler.yaml). `config` is
  # a literal, not a caller-supplied input (R4): the real, fixed base
  # config appstore-connect/deploy_ios, under this document's own real
  # secret names -- see this file's own header for the sandbox-naming
  # gap this leaves. ---
  issuer_id_text:
    tool: doppler.value.get
    with:
      config: appstore-connect/deploy_ios
      name: APP_STORE_CONNECT_API_KEY_ISSUER_ID
  issuer_id:
    tool: apple.issuer_id.parse
    with:
      value: ${{ steps.issuer_id_text.value }}
  key_id_text:
    tool: doppler.value.get
    with:
      config: appstore-connect/deploy_ios
      name: APP_STORE_CONNECT_API_KEY_ID
  key_id:
    tool: apple.key_id.parse
    with:
      value: ${{ steps.key_id_text.value }}
  key_base64:
    tool: doppler.secret.get
    with:
      config: appstore-connect/deploy_ios
      name: APP_STORE_CONNECT_API_KEY_BASE64
  key_decoded:
    tool: base64.decode
    with:
      value: ${{ steps.key_base64.value }}
  key:
    tool: apple.signing_key.parse
    with:
      value: ${{ steps.key_decoded.value }}

  # --- The three bundle identifiers. `name` is a plain literal, never the
  # identifier: milestone 3e task T3f found live that Apple refuses a dot,
  # an apostrophe, or an ampersand in a bundle id's `name` attribute (409
  # ENTITY_ERROR.ATTRIBUTE.INVALID), so the identifier => name conversion
  # decision (h) registered is gone (it was never total against Apple's
  # real rule) and every bundle id name in this document is now its own
  # literal, following the account's existing "Foo - Bar" naming habit
  # (the coordinator's proposal; the operator may still change these). ---
  app_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.app_identifier }}
      name: "Walter"
      platform: UNIVERSAL
  nse_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.nse_identifier }}
      name: "Walter - NSE"
      platform: UNIVERSAL
  widgets_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.widgets_identifier }}
      name: "Walter - Widgets"
      platform: UNIVERSAL

  # --- Host-identifier-only API capabilities (decision (c)): each binds
  # `identifier` from `steps.app_id.identifier`, never from the input, so
  # the data edge orders it after registration ---
  healthkit:
    tool: appstore.bundle_id_capability.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: HEALTHKIT
  push:
    tool: appstore.bundle_id_capability.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: PUSH_NOTIFICATIONS
  data_protection:
    tool: appstore.bundle_id_capability.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: DATA_PROTECTION
      # W1: a bare literal, not a caller-overridable input any more --
      # "Just update the doc". Names the same Apple data-protection class
      # as `Walter.entitlements`' own `com.apple.developer.default-data-protection`
      # value below; `walter_document.rs` pins both together.
      setting: "DATA_PROTECTION_PERMISSION_LEVEL=PROTECTED_UNTIL_FIRST_USER_AUTH"

  # --- M1: the app record gate, a leaf. Bound from app_id's own output, so
  # it is read after the identifier that names it is known, but nothing
  # downstream depends on this gate's own output. ---
  app_record:
    tool: appstore.app.get
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}

  # --- M2: one APP_GROUPS gate per identifier. Each passes `identifier`
  # through -- the profile nodes below bind from these, never from
  # app_id/nse_id/widgets_id directly (decision (j), point 2). ---
  app_app_groups:
    tool: appstore.app_group.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
  nse_app_groups:
    tool: appstore.app_group.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.nse_id.identifier }}
  widgets_app_groups:
    tool: appstore.app_group.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.widgets_id.identifier }}

  # --- The App Attest gate (2026-09-30 addendum, fact 2): App Attest
  # works in the host app and in watchOS/action/SSO extensions only --
  # Apple's own docs state `generateKey` fails when called from an app
  # extension regardless of `isSupported` -- so this gate runs on the
  # host identifier alone; the NSE and widgets extensions get no gate and
  # no App Attest capability at all. The API can only ever show this
  # capability *enabled* (fact 2: both a live `POST` attempt and a bare
  # OpenAPI declaration refuse it), never turn it on, so this is a pure
  # observed gate exactly like app_app_groups above -- willikins reports
  # the need, the operator enables App Attest for the host identifier in
  # the portal (Configure) or Xcode's Signing & Capabilities, and the
  # next run of this same document proceeds. Reads from `app_id`
  # directly (not chained through `app_app_groups`) so both gates are
  # reported together on the very first run the operator sees, rather
  # than the App Attest need surfacing only after App Groups is already
  # done -- one portal visit covers both, not two runs apart. ---
  app_app_attest:
    tool: appstore.bundle_id_capability.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: APP_ATTEST

  # --- The distribution certificate every profile below is signed with
  # (never a literal id -- milestone 3c's own convention) ---
  certificate:
    tool: appstore.certificate.get
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      certificate_type: ${{ inputs.certificate_type }}
      serial_number: ${{ inputs.serial_number }}
      key: ${{ steps.key.value }}

  # --- The three App Store profiles, named after their identifiers
  # (decision (h)'s "bundle id everywhere" convention, through the
  # AppleBundleIdentifier => AppleProfileName conversion), each behind its
  # own app-group gate above (operator decision 1: appstore.profile.ensure
  # replaces a profile Apple invalidated). The host profile additionally
  # binds `identifier` through `app_app_attest` rather than
  # `app_app_groups` -- both gates pass the same identifier through
  # unchanged (decision (j), point 2, "a gate passes through the key it
  # checked"), so binding `identifier` from one and `name` from the other
  # still names one value, but the data edge now orders `app_profile`
  # after *both* gates: either one blocked holds the host profile back. The NSE and widgets profiles are
  # unaffected -- no App Attest gate applies to an extension. ---
  app_profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_app_attest.identifier }}
      name: ${{ steps.app_app_groups.identifier }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}
  nse_profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.nse_app_groups.identifier }}
      name: ${{ steps.nse_app_groups.identifier }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}
  widgets_profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.widgets_app_groups.identifier }}
      name: ${{ steps.widgets_app_groups.identifier }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}

  # --- Doppler: project walter, plain dev/stg/prd root configs (no
  # inheritance), plus prd_config: the operator's real layout (decision 2,
  # task B1) -- a single named branch config, prd_deployment_ios, under
  # environment prd, created by doppler.branch_config.ensure and inheriting
  # the three base configs below. ---
  names:
    tool: naming.v1
    with:
      org: Bande-a-Bonnot
      slug: walter
  doppler:
    tool: doppler.project.ensure
    with:
      project: ${{ steps.names.doppler_project }}
  configs:
    tool: doppler.config.ensure
    for_each: ${{ inputs.environments }}
    with:
      project: ${{ steps.doppler.project }}
      environment: ${{ item }}
  prd_config:
    tool: doppler.branch_config.ensure
    with:
      project: ${{ steps.doppler.project }}
      environment: prd
      branch: deployment_ios
  # --- D1: one gate per base config, ahead of the inheritance. Missing
  # or non-inheritable blocks at plan time instead of `inherit` failing
  # mid-apply (R3's own carried-forward "remaining", now wired in). Each
  # instance passes `config` through as its own output; `inherit.inherits`
  # binds the *aggregate* of all three instances (a `Step` binding over a
  # `for_each` gate node -- decision (j), point 3), which is itself
  # skipped when any one instance is blocked, so `inherit` is Skip
  # whenever any base config is missing or not inheritable. ---
  base_config_gate:
    tool: doppler.config.inheritable.gate
    for_each: ${{ inputs.base_configs }}
    with:
      config: ${{ item }}
  inherit:
    tool: doppler.config.inherits.ensure
    with:
      config: ${{ steps.prd_config.config }}
      inherits: ${{ steps.base_config_gate.config }}

  # --- No copy of the three profiles goes into Doppler: the monorepo's
  # CI fetches each profile from Apple by name at build time (fastlane's
  # get_provisioning_profile, readonly, with the App Store Connect key
  # deploy_ios already holds), and a profile's name here is its bundle
  # identifier, so the profile nodes above are all CI needs. A stored copy
  # would go stale whenever Apple invalidates a profile, and a write-only
  # doppler.secret.set reports Created on every run, so a converged run
  # could never read NoOp end to end. ---

  # --- The monorepo, referenced (decisions (f) and (g)). The GitHub
  # read-only token is resolved from Doppler (R4), mirroring R2's
  # workflows/github-repo-token-from-doppler.yaml exactly: gh_token_secret
  # into gh_token, bound to monorepo_ref's own optional `token` port. ---
  gh_token_secret:
    tool: doppler.secret.get
    with:
      config: github/bande-a-bonnot
      name: GH_CLONE_TOKEN
  gh_token:
    tool: github.token.parse
    with:
      value: ${{ steps.gh_token_secret.value }}
  monorepo_ref:
    tool: github.repo.get
    with:
      repo: Bande-a-Bonnot/monorepo
      token: ${{ steps.gh_token.value }}

  # ------------------------------------------------------------------
  # W1 (milestone 3g): Walter's files, rendered and scaffolded.
  #
  # Seventeen `repo.file.render` nodes (task T1, decision (i)), one per
  # file the survey found; every placeholder is exactly `{{ N }}`, and the
  # only values ever substituted are the three bundle identifiers --
  # converted from `AppleBundleIdentifier` to `TemplateValue`, never a
  # caller-controlled `Text` (decision (e)). `values` order is fixed:
  # `0` = the host app's identifier, `1` = the NSE's, `2` = the widgets
  # extension's, matching `ios/BUILD.bazel`'s own three
  # `local_provisioning_profile`s; every entitlements file binds only `0`
  # (the host app's identifier), since `com.apple.security.application-groups`
  # names one shared app group keyed by the host identifier, not each
  # target's own. No `team_id` anywhere (decision (j)): the account's own
  # permanent-platform-trap lesson (fact 1, this file's own header)
  # applies equally to a Bazel attribute this workspace cannot read back.
  # ------------------------------------------------------------------
  build_bazel_app:
    tool: repo.file.render
    with:
      path: apps/walter/BUILD.bazel
      template: |
        # Walter app package.
  build_bazel_ios:
    tool: repo.file.render
    with:
      path: apps/walter/ios/BUILD.bazel
      values: ['${{ inputs.app_identifier }}', '${{ inputs.nse_identifier }}', '${{ inputs.widgets_identifier }}']
      template: |
        load("@rules_apple//apple:apple.bzl", "local_provisioning_profile")
        load("@rules_apple//apple:ios.bzl", "ios_application", "ios_extension")
        load("@rules_apple//apple:versioning.bzl", "apple_bundle_version")
        load("@rules_swift//swift:swift.bzl", "swift_library")

        config_setting(
            name = "ci_build",
            define_values = {"ci": "true"},
            visibility = ["//apps/walter:__subpackages__"],
        )

        config_setting(
            name = "internal_build",
            define_values = {"variant": "internal"},
            visibility = ["//apps/walter:__subpackages__"],
        )

        config_setting(
            name = "ios_simulator_build",
            define_values = {"ios_simulator": "true"},
            visibility = ["//apps/walter:__subpackages__"],
        )

        config_setting(
            name = "internal_simulator_build",
            define_values = {
                "ios_simulator": "true",
                "variant": "internal",
            },
            visibility = ["//apps/walter:__subpackages__"],
        )

        config_setting(
            name = "beta_simulator_build",
            define_values = {
                "ios_simulator": "true",
                "variant": "beta",
            },
            visibility = ["//apps/walter:__subpackages__"],
        )

        config_setting(
            name = "beta_build",
            define_values = {"variant": "beta"},
            visibility = ["//apps/walter:__subpackages__"],
        )

        apple_bundle_version(
            name = "app_version",
            build_label_pattern = "{version}.{build}",
            build_version = "{version}.{build}",
            capture_groups = {
                "version": "\d+\.\d+\.\d+",
                "build": "\d+",
            },
            fallback_build_label = "0.1.0.0",
            short_version_string = "{version}",
        )

        local_provisioning_profile(
            name = "local_profile",
            profile_name = "iOS Team Provisioning Profile: *",
            tags = ["manual"],
        )

        local_provisioning_profile(
            name = "distribution_profile",
            profile_name = "{{ 0 }}",
            tags = ["manual"],
        )

        local_provisioning_profile(
            name = "nse_distribution_profile",
            profile_name = "{{ 1 }}",
            tags = ["manual"],
        )

        local_provisioning_profile(
            name = "widgets_distribution_profile",
            profile_name = "{{ 2 }}",
            tags = ["manual"],
        )

        swift_library(
            name = "WalterAppLib",
            srcs = glob(["Walter/Sources/**/*.swift"]),
            module_name = "Walter",
            target_compatible_with = ["@platforms//os:ios"],
            visibility = ["//build/visibility:ios"],
        )

        swift_library(
            name = "WalterNotificationServiceLib",
            srcs = glob(["WalterNotificationService/Sources/**/*.swift"]),
            module_name = "WalterNotificationService",
            target_compatible_with = ["@platforms//os:ios"],
        )

        swift_library(
            name = "WalterWidgetsLib",
            srcs = glob(["WalterWidgets/Sources/**/*.swift"]),
            module_name = "WalterWidgets",
            target_compatible_with = ["@platforms//os:ios"],
        )

        ios_extension(
            name = "WalterNotificationServiceExtension",
            bundle_id = "{{ 1 }}",
            bundle_name = "WalterNotificationService",
            entitlements = select({
                ":ci_build": None,
                ":ios_simulator_build": None,
                ":internal_simulator_build": None,
                ":beta_simulator_build": None,
                "//conditions:default": "Resources/WalterNotificationService.entitlements",
            }),
            families = [
                "iphone",
                "ipad",
            ],
            infoplists = ["Resources/WalterNotificationService-Info.plist"],
            minimum_os_version = "17.0",
            provisioning_profile = select({
                ":internal_simulator_build": None,
                ":beta_simulator_build": None,
                ":ios_simulator_build": None,
                ":internal_build": ":nse_distribution_profile",
                ":beta_build": ":nse_distribution_profile",
                ":ci_build": None,
                "//conditions:default": ":local_profile",
            }),
            version = ":app_version",
            deps = [":WalterNotificationServiceLib"],
        )

        ios_extension(
            name = "WalterWidgetsExtension",
            bundle_id = "{{ 2 }}",
            bundle_name = "WalterWidgets",
            entitlements = select({
                ":ci_build": None,
                ":ios_simulator_build": None,
                ":internal_simulator_build": None,
                ":beta_simulator_build": None,
                "//conditions:default": "Resources/WalterWidgets.entitlements",
            }),
            families = [
                "iphone",
                "ipad",
            ],
            infoplists = ["Resources/WalterWidgets-Info.plist"],
            minimum_os_version = "17.0",
            provisioning_profile = select({
                ":internal_simulator_build": None,
                ":beta_simulator_build": None,
                ":ios_simulator_build": None,
                ":internal_build": ":widgets_distribution_profile",
                ":beta_build": ":widgets_distribution_profile",
                ":ci_build": None,
                "//conditions:default": ":local_profile",
            }),
            version = ":app_version",
            deps = [":WalterWidgetsLib"],
        )

        ios_application(
            name = "Walter",
            bundle_id = "{{ 0 }}",
            bundle_name = "Walter",
            entitlements = select({
                ":ci_build": None,
                ":ios_simulator_build": None,
                ":internal_simulator_build": None,
                ":beta_simulator_build": None,
                "//conditions:default": "Resources/Walter.entitlements",
            }),
            extensions = [
                ":WalterNotificationServiceExtension",
                ":WalterWidgetsExtension",
            ],
            families = [
                "iphone",
                "ipad",
            ],
            infoplists = ["Resources/Info.plist"],
            minimum_os_version = "17.0",
            provisioning_profile = select({
                ":internal_simulator_build": None,
                ":beta_simulator_build": None,
                ":ios_simulator_build": None,
                ":internal_build": ":distribution_profile",
                ":beta_build": ":distribution_profile",
                ":ci_build": None,
                "//conditions:default": ":local_profile",
            }),
            resources = ["Resources/PrivacyInfo.xcprivacy"],
            version = ":app_version",
            visibility = ["//build/visibility:ios"],
            deps = [":WalterAppLib"],
        )
  walter_app_swift:
    tool: repo.file.render
    with:
      path: apps/walter/ios/Walter/Sources/WalterApp.swift
      template: |
        import SwiftUI

        @main
        struct WalterApp: App {
            var body: some Scene {
                WindowGroup {
                    Text("Walter")
                }
            }
        }
  nse_swift:
    tool: repo.file.render
    with:
      path: apps/walter/ios/WalterNotificationService/Sources/NotificationService.swift
      template: |
        import UserNotifications

        final class NotificationService: UNNotificationServiceExtension {
            private var contentHandler: ((UNNotificationContent) -> Void)?
            private var bestAttemptContent: UNMutableNotificationContent?

            override func didReceive(
                _ request: UNNotificationRequest,
                withContentHandler contentHandler: @escaping (UNNotificationContent) -> Void
            ) {
                self.contentHandler = contentHandler
                bestAttemptContent = request.content.mutableCopy() as? UNMutableNotificationContent
                if let bestAttemptContent {
                    contentHandler(bestAttemptContent)
                }
            }

            override func serviceExtensionTimeWillExpire() {
                if let contentHandler, let bestAttemptContent {
                    contentHandler(bestAttemptContent)
                }
            }
        }
  widgets_swift:
    tool: repo.file.render
    with:
      path: apps/walter/ios/WalterWidgets/Sources/WalterWidgets.swift
      template: |
        import SwiftUI
        import WidgetKit

        struct WalterPlaceholderEntry: TimelineEntry {
            let date: Date
        }

        struct WalterPlaceholderProvider: TimelineProvider {
            func placeholder(in context: Context) -> WalterPlaceholderEntry {
                WalterPlaceholderEntry(date: Date())
            }

            func getSnapshot(in context: Context, completion: @escaping (WalterPlaceholderEntry) -> Void) {
                completion(WalterPlaceholderEntry(date: Date()))
            }

            func getTimeline(in context: Context, completion: @escaping (Timeline<WalterPlaceholderEntry>) -> Void) {
                completion(Timeline(entries: [WalterPlaceholderEntry(date: Date())], policy: .never))
            }
        }

        struct WalterPlaceholderWidget: Widget {
            let kind: String = "WalterPlaceholderWidget"

            var body: some WidgetConfiguration {
                StaticConfiguration(kind: kind, provider: WalterPlaceholderProvider()) { _ in
                    Text("Walter")
                }
                .configurationDisplayName("Walter")
                .description("A placeholder widget.")
            }
        }

        @main
        struct WalterWidgets: WidgetBundle {
            var body: some Widget {
                WalterPlaceholderWidget()
            }
        }
  info_plist:
    tool: repo.file.render
    with:
      path: apps/walter/ios/Resources/Info.plist
      template: |
