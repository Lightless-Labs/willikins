      template: |
        {
          "name": "Walter Release Stage Input",
          "description": "Bind a release stage to its predecessor's verified artifacts within the same build.",
          "author": "https://github.com/Bande-a-Bonnot",
          "requirements": ["python3", "buildkite-agent"],
          "configuration": {
            "type": "object",
            "properties": {},
            "additionalProperties": false
