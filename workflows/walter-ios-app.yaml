  # Buildkite agent (a 100644 POSIX-shell hook is TypeShell and is
  # sourced, never executed), so it must never `exec` and never `exit` on
  # its success path, or the wrapper's own after-dump never runs. Stages
  # walter-package's verified bytes into this build's checkout so
  # walter-upload, running in the same build, can send exactly them.
  stage_input_pre_command:
    tool: repo.file.render
    with:
      path: apps/walter/.buildkite/plugins/stage-input/hooks/pre-command
      template: |
        #!/usr/bin/env bash
        set -euo pipefail

        : "${BUILDKITE_BUILD_CHECKOUT_PATH:?missing Buildkite checkout path}"
        python3 "$BUILDKITE_BUILD_CHECKOUT_PATH/apps/walter/tools/walter_ci.py" stage-ipa --checkout "$BUILDKITE_BUILD_CHECKOUT_PATH"

  # W1: the write credential (decision (l)) -- new and narrow (Contents:
  # read and write only, never the older, wider gh_token above), from a
  # Doppler branch config no app config inherits.
  gh_write_token_secret:
    tool: doppler.secret.get
    with:
      config: github/bande-a-bonnot_willikins
      name: GH_CONTENTS_WRITE_TOKEN
  gh_write_token:
    tool: github.token.parse
    with:
      value: ${{ steps.gh_write_token_secret.value }}

  # W1: the scaffold itself -- one commit, all seventeen renders plus the
  # ownership marker, direct to `main` (decision (f)).
  walter_files:
    tool: github.scaffold.ensure
    with:
      repo: ${{ steps.monorepo_ref.repo }}
      branch: main
      marker: apps/walter/.willikins-scaffold
      files:
        - ${{ steps.build_bazel_app.file }}
        - ${{ steps.build_bazel_ios.file }}
        - ${{ steps.walter_app_swift.file }}
        - ${{ steps.nse_swift.file }}
        - ${{ steps.widgets_swift.file }}
        - ${{ steps.info_plist.file }}
        - ${{ steps.nse_info_plist.file }}
        - ${{ steps.widgets_info_plist.file }}
        - ${{ steps.walter_entitlements.file }}
        - ${{ steps.nse_entitlements.file }}
        - ${{ steps.widgets_entitlements.file }}
        - ${{ steps.privacy_manifest.file }}
        - ${{ steps.pipeline_yml.file }}
        - ${{ steps.upload_pipeline_sh.file }}
        - ${{ steps.bootstrap_yml.file }}
        - ${{ steps.provider_settings.file }}
        - ${{ steps.buildkite_readme.file }}
        - ${{ steps.generate_app_icon_py.file }}
        - ${{ steps.walter_gitignore.file }}
        - ${{ steps.release_config_json.file }}
        - ${{ steps.walter_ci_common_py.file }}
        - ${{ steps.walter_asc_py.file }}
        - ${{ steps.walter_ci_tests_init_py.file }}
        - ${{ steps.test_walter_ci_common_py.file }}
        - ${{ steps.test_walter_asc_py.file }}
        - ${{ steps.walter_signing_py.file }}
        - ${{ steps.walter_ipa_py.file }}
        - ${{ steps.test_walter_signing_py.file }}
        - ${{ steps.test_walter_ipa_py.file }}
        - ${{ steps.walter_ci_py.file }}
        - ${{ steps.test_walter_ci_py.file }}
        - ${{ steps.signing_preflight_yml.file }}
        - ${{ steps.release_yml.file }}
        - ${{ steps.stage_input_plugin_yml.file }}
        - ${{ steps.stage_input_pre_command.file }}
      message: "feat(walter): scaffold the iOS app, NSE, widgets and Buildkite files"
      token: ${{ steps.gh_write_token.value }}

  # --- D2: the Buildkite token, resolved from Doppler the same way, and
  # `buildkite_org`/`cluster` as bare literals (this document's header). ---
  bk_token_secret:
    tool: doppler.secret.get
    with:
      config: buildkite/prd
      name: PIPELINE_CREATION_TOKEN
  bk_token:
    tool: buildkite.token.parse
    with:
      value: ${{ steps.bk_token_secret.value }}
  buildkite_cluster:
    tool: buildkite.cluster.get
    with:
      org: la-bande-a-bonnot
      name: Default cluster
      token: ${{ steps.bk_token.value }}
  # W1: `repo` is rebound from `monorepo_ref.repo` to `walter_files.repo`,
  # so the pipeline is created only after its own `.buildkite/` files
  # exist on the branch.
  pipeline:
    tool: buildkite.pipeline.ensure
    with:
      org: la-bande-a-bonnot
      slug: ${{ steps.names.buildkite_pipeline_slug }}
      repo: ${{ steps.walter_files.repo }}
      cluster: ${{ steps.buildkite_cluster.cluster }}
      token: ${{ steps.bk_token.value }}

  # 3i: M7 is now a write, not an observed gate (decision (a9), header
  # paragraph above). `bootstrap` stores `bootstrap_yml.file` as the
  # pipeline's configuration whenever it differs -- never anything else,
  # since `configuration` accepts only a `RepoFile` (trust boundary 1).
  bootstrap:
    tool: buildkite.pipeline.bootstrap.ensure
    with:
      org: la-bande-a-bonnot
      slug: ${{ steps.pipeline.slug }}
      configuration: ${{ steps.bootstrap_yml.file }}
      token: ${{ steps.bk_token.value }}

  # --- The one step that stays reported only: no API exposes its state,
  # so it waits for the operator's own acknowledgement. M3 and M7 used to
  # be two more leaves here, and M6 a third; see this file's own header,
  # milestones 3g and 3h, for why they are gone. ---
  m5_apns_key:
    tool: operator.acknowledge
    with:
      step: "Confirm the team's APNs auth key (.p8) is in a shared base config Walter inherits; if none exists, create one in the portal (Account Holder or Admin; downloadable once)."
      acknowledged: ${{ inputs.m5_apns_key_done }}

  # W7 (milestone 3h): M6 is now a real node, not an acknowledgement --
  # see this file's own header, milestone 3h, for why. `project` is a
  # data edge from `doppler`'s own output, so this node is ordered after
  # the project it grants access to (predicted at plan time on a first
  # run, the same pass-through shape `configs`/`prd_config` already rely
  # on). `service_account` is the CI service account's real name.
  # `role`/`environments` are
  # SHARED VALUES' own choice: the least access that lets CI read --
  # `viewer` on `prd` alone, where the deployment secrets actually live.
  ci_doppler_access:
    tool: doppler.project_member.ensure
    with:
      project: ${{ steps.doppler.project }}
      service_account: Buildkite
      role: viewer
      environments: [prd]
outputs:
  app_id: ${{ steps.app_id.id }}
  nse_id: ${{ steps.nse_id.id }}
  widgets_id: ${{ steps.widgets_id.id }}
  app_identifier: ${{ steps.app_id.identifier }}
  nse_identifier: ${{ steps.nse_id.identifier }}
  widgets_identifier: ${{ steps.widgets_id.identifier }}
  pipeline_url: ${{ steps.pipeline.url }}
