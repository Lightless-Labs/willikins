# Milestone 3e, task 3: one document provisions everything a provider API
# can provision for Walter, the operator's iOS health app -- the app, a
# notification service extension (`.nse`) and a widgets extension
# (`.widgets`), no watchOS app for now. It lives in the existing
# Bande-a-Bonnot monorepo (`Bande-a-Bonnot/monorepo`), referenced through
# `github.repo.get`, never created.
#
# The operator's real identifiers (never a default -- trust boundary 2 of
# `docs/plans/2026-09-27-milestone-3e-new-ios-app.md`):
#   com.bande-a-bonnot.walter
#   com.bande-a-bonnot.walter.nse
#   com.bande-a-bonnot.walter.widgets
# following the account's existing suffix habit (`.nse`, `.keyboard`,
# `.stickers`). A dry run instead passes three throwaway identifiers under
# `com.willikins.probe.delete-me.<unique>`.
#
# What this document CANNOT automate, per the pre-flight checklist, becomes
# either an *observed gate* (this document reads the real state and blocks
# until it is true) or an *acknowledgement gate* (no API exposes the state,
# so the document waits for the operator's own `done`) -- decision (j),
# "a manual step is a gate: blocked, not failed; re-running the document is
# the resume". Every node is idempotent, so re-running this same document
# once a gate's `need` is met is the whole resume story; nothing here saves
# run state.
#
#   - M1, the App Store Connect app record: `app_record`, a LEAF gate over
#     `appstore.app.get` (`GET /v1/apps`) -- no API can create an app
#     record at all (research note, section 4), so nothing in this
#     document is ordered by it; it blocks the run and is reported, but
#     holds nothing back.
#   - M2, `APP_GROUPS` enabled and the group assigned on all three
#     identifiers: `app_app_groups` / `nse_app_groups` / `widgets_app_groups`,
#     one `appstore.app_group.gate` per identifier. Each passes `identifier`
#     through as its own output, and each profile node below binds
#     `identifier` from *its own* gate's output, never from the
#     registration node directly -- that data edge is what orders the
#     profile after the gate. The API only shows the flag *enabled*, never
#     the group actually *assigned* (pre-flight row 14), so this gate can
#     pass before the operator finishes the portal-side assignment; a
#     profile minted at that point is one Apple will invalidate, and the
#     *next* run of this same document replaces it
#     (`appstore.profile.ensure`'s replace-when-INVALID, operator decision
#     1). So the flow is: run this document; assign the app group by hand
#     (M2); run the SAME document again, which replaces the profiles Apple
#     invalidated.
#   - M3 (repo files), M5 (an APNs key), M6 (the CI Doppler grant), M7
#     (reseeding the Buildkite pipeline's stored bootstrap): four
#     `operator.acknowledge` leaves, `m3_repo_files_done` /
#     `m5_apns_key_done` / `m6_ci_doppler_access_done` / `m7_bootstrap_done`.
#     None of these has a typed pass-through (decision (j), point 6's own
#     honest limit), so each is a leaf: it blocks the run's outcome and is
#     reported, but orders nothing else in this graph.
#   - M4 (minting the three profiles) is no longer manual: operator
#     decision 1 put the profiles in this document, behind M2's gates.
#   - M0 (confirming the shared base config names) is gone: operator
#     decision 2 names the real configs below, not a placeholder.
#
# **Superseded 2026-09-29 (milestone 3e task B1).** The KNOWN GAP this
# comment used to record -- "no tool can create a named branch Doppler
# config, so this document approximates by making every root config
# inherit the three base configs" -- is closed: `doppler.branch_config.ensure`
# now exists (`crates/willikins-providers-doppler/src/tools/branch_config_ensure.rs`),
# and `prd_config` below creates the operator's real, single
# `prd_deployment_ios` branch config, which alone inherits the three base
# configs. `dev`/`stg`/`prd` are now plain root configs with no
# inheritance, exactly as operator decision 2 asked -- `dev`/`stg` no
# longer gain the deployment credentials the old approximation leaked to
# them.
#
# SigNoz: nothing in this document calls it. Decision 2's "the SigNoz key
# into Doppler" is satisfied by Doppler's own config inheritance from
# `open-telemetry/prd_signoz`, one of the three base configs below --
# willikins never reads or writes the key itself.
#
# VERIFY ITEM 12, settled (R1, 2026-09-29): a live probe against the
# sandbox workplace found Doppler accepts a config literally named
# `bande-a-bonnot`, hyphenated, exactly as operator decision 2 wrote it --
# `DopplerConfigName`'s grammar widened to accept the hyphen rather than
# this document needing to guess an underscored substitute. `base_configs`
# below names the real config directly, `github/bande-a-bonnot`.
#
# **R4 (2026-09-29, this task): the real layout, edited in place.** The
# App Store Connect credential is no longer read from a caller-supplied
# `config` input: this document now reads it directly from
# `appstore-connect/deploy_ios`, one of the operator's real shared base
# configs (decision 2), under `APP_STORE_CONNECT_API_KEY_ISSUER_ID`,
# `APP_STORE_CONNECT_API_KEY_ID` and `APP_STORE_CONNECT_API_KEY_BASE64` --
# the real workplace's own names for those three secrets, not the
# `ASC_API_KEY_*` names this document used before this task. The GitHub
# token is resolved from Doppler the same way, mirroring R2's
# `workflows/github-repo-token-from-doppler.yaml` exactly: `gh_token_secret`
# (`doppler.secret.get` against `github/bande-a-bonnot`, `GH_CLONE_TOKEN`)
# into `gh_token` (`github.token.parse`), bound to `monorepo_ref`'s own
# optional `token` port -- so the monorepo reference authenticates as the
# project's own Doppler-held credential, never a bare
# `WILLIKINS_GITHUB_TOKEN` from the process environment (R2's own stated
# gap still applies: the live server still reads that variable from the
# process whenever *any* `github.*` tool is named in a document, so it
# must still be set in the process environment for a live run of this
# document even though this graph no longer needs it to resolve).
#
# **Sandbox naming gap, not fixed here.** The sandbox Doppler workplace's
# App Store Connect config still names these three secrets
# `ASC_API_KEY_ISSUER_ID` / `ASC_API_KEY_ID` / `ASC_API_KEY_BASE64` (this
# document's own names before this task) -- so a sandbox `plan`/`apply` of
# this document will not find `APP_STORE_CONNECT_API_KEY_*` under
# whatever config the sandbox calls `appstore-connect/deploy_ios`, and
# will fail with `NotFound` at `issuer_id_text` unless the sandbox
# workplace is reseeded under the real names first. This document is
# written for the real workplace's own naming now, not the sandbox's.
#
# **D1 (2026-09-30): the base-config gate is wired in, and `org`/`slug`/
# `monorepo` are true literals.** `base_config_gate` (`doppler.config.inheritable.gate`,
# `for_each: ${{ inputs.base_configs }}`) now sits ahead of `inherit`:
# `inherit.inherits` binds the aggregate of all three instances
# (`${{ steps.base_config_gate.config }}`), not `${{ inputs.base_configs }}`
# directly, so a base config that is missing or not yet marked inheritable
# blocks its own gate instance at plan time and `inherit` itself plans
# `Skip` -- never a mid-apply failure after `doppler`/`configs`/`prd_config`
# have already written (closing R3's own carried-forward "remaining"). The
# three `doppler.secret.set` nodes below bind `config` from `prd_config`,
# never from `inherit`, so a blocked base config holds back `inherit` alone.
# `org` (`Bande-a-Bonnot`), `slug` (`walter`) and `monorepo`
# (`Bande-a-Bonnot/monorepo`) are no longer caller-overridable inputs --
# the operator's own words, "Just update the doc": each is now a bare
# literal at its one use site (`names.org`/`names.slug`,
# `monorepo_ref.repo`). `base_configs` itself stays a defaulted input,
# not a literal -- the document format has no syntax to bind a list
# literal to a `with:` port, and `for_each` must always be a reference
# (`doppler-ios.yaml`'s own header makes the identical point); its
# `default:` is this document's actual policy regardless.
#
# **D2 (2026-09-30): the Buildkite credential is resolved from Doppler,
# and `buildkite_org`/`cluster` become literals.** Mirrors R4's own
# GitHub chain exactly: `bk_token_secret` (`doppler.secret.get` against
# `buildkite/prd`, `PIPELINE_CREATION_TOKEN` -- the real workplace's own
# secret, task brief) into `bk_token` (`buildkite.token.parse`), bound to
# both `buildkite_cluster.token` and `pipeline.token` (K1's optional
# port), so the pipeline chain authenticates as the project's own
# Doppler-held credential, never `WILLIKINS_BUILDKITE_TOKEN` from the
# process environment. `buildkite_org` and `cluster` are no longer
# caller-overridable inputs -- the same "Just update the doc" the D1
# addendum already applied to `org`/`slug`/`monorepo`: each is now a bare
# literal at its one use site, `la-bande-a-bonnot` (the real Buildkite
# org slug) and `Default cluster` (the real org's only cluster, both
# probed read-only 2026-09-29). **R4's own "must still be set in the
# process environment" claim above was about `WILLIKINS_GITHUB_TOKEN`,
# and L1 (2026-09-30) already superseded it for GitHub: this task
# extends the same relief to Buildkite. `live_catalog_for_document` now
# demands `WILLIKINS_BUILDKITE_TOKEN` only when some `buildkite.*` node
# leaves `token` unbound, and after this task neither one does, so `plan
# workflows/walter-ios-app.yaml --live` / `apply ... --live` need neither
# `WILLIKINS_GITHUB_TOKEN` nor `WILLIKINS_BUILDKITE_TOKEN` -- only
# `WILLIKINS_DOPPLER_TOKEN` (`serve` and `apply --plan-id --live` are
# untouched by L1 and still require both unconditionally at startup).**
name: walter-ios-app
description: Provision Walter (app, NSE, widgets) end to end -- bundle identifiers, capabilities, signing profiles, the monorepo reference, Doppler, and the Buildkite pipeline -- reporting every manual step as a gate.
inputs:
  app_identifier: { type: AppleBundleIdentifier, description: "The app's bundle identifier, e.g. com.bande-a-bonnot.walter -- no default (trust boundary 2)" }
  nse_identifier: { type: AppleBundleIdentifier, description: "The notification service extension's bundle identifier, e.g. com.bande-a-bonnot.walter.nse" }
  widgets_identifier: { type: AppleBundleIdentifier, description: "The widgets extension's bundle identifier, e.g. com.bande-a-bonnot.walter.widgets" }
  platform: { type: AppleBundleIdPlatform, default: IOS }
  data_protection: { type: AppleCapabilitySetting, default: "DATA_PROTECTION_PERMISSION_LEVEL=PROTECTED_UNTIL_FIRST_USER_AUTH", description: "Decision (e): the NSE and HealthKit background delivery both run while the device may be locked, so anything stricter than iOS's own default needs code-level exceptions first." }
  certificate_type: { type: AppleCertificateType, description: "DISTRIBUTION or IOS_DISTRIBUTION" }
  serial_number: { type: AppleCertificateSerial, description: "The distribution certificate's serial number every profile below is signed with" }
  environments: { type: list<EnvironmentSlug>, default: [dev, stg, prd] }
  base_configs: { type: list<DopplerConfig>, default: [appstore-connect/deploy_ios, github/bande-a-bonnot, open-telemetry/prd_signoz], description: "Operator decision 2's real shared base configs, inherited by prd_config alone (task B1). This default IS the document's policy (D1) -- edited here, never threaded through per run; it stays an ordinary overridable input only because the document format has no syntax to bind a list literal directly to a with: port (doppler-ios.yaml's own header explains the same gap). Each entry is gated by base_config_gate below before inherit ever names it." }
  m3_repo_files_done: { type: OperatorAcknowledgement, description: "M3: Walter's files (BUILD.bazel, entitlements, Info.plist, .buildkite/) added under apps/walter/ in the monorepo, following the survey in the milestone plan." }
  m5_apns_key_done: { type: OperatorAcknowledgement, description: "M5: the team's APNs auth key (.p8) is confirmed in a shared base config Walter inherits, or freshly created if none exists." }
  m6_ci_doppler_access_done: { type: OperatorAcknowledgement, description: "M6: the Buildkite CI Doppler service account has been granted read access to project walter." }
  m7_bootstrap_done: { type: OperatorAcknowledgement, description: "M7: the walter pipeline's stored bootstrap has been replaced with apps/walter/.buildkite/bootstrap.yml, read back and compared." }
steps:
  # --- The App Store Connect credential, resolved from Doppler (the same
  # seven-node chain as appstore-bundle-id-from-doppler.yaml). `config` is
  # a literal, not a caller-supplied input (R4): the real, fixed base
  # config appstore-connect/deploy_ios, under this document's own real
  # secret names -- see this file's own header for the sandbox-naming
  # gap this leaves. ---
  issuer_id_text:
    tool: doppler.value.get
    with:
      config: appstore-connect/deploy_ios
      name: APP_STORE_CONNECT_API_KEY_ISSUER_ID
  issuer_id:
    tool: apple.issuer_id.parse
    with:
      value: ${{ steps.issuer_id_text.value }}
  key_id_text:
    tool: doppler.value.get
    with:
      config: appstore-connect/deploy_ios
      name: APP_STORE_CONNECT_API_KEY_ID
  key_id:
    tool: apple.key_id.parse
    with:
      value: ${{ steps.key_id_text.value }}
  key_base64:
    tool: doppler.secret.get
    with:
      config: appstore-connect/deploy_ios
      name: APP_STORE_CONNECT_API_KEY_BASE64
  key_decoded:
    tool: base64.decode
    with:
      value: ${{ steps.key_base64.value }}
  key:
    tool: apple.signing_key.parse
    with:
      value: ${{ steps.key_decoded.value }}

  # --- The three bundle identifiers (decision (h): names bound from the
  # identifiers through the AppleBundleIdentifier => AppleBundleIdName
  # conversion, "the operator's bundle-id-everywhere habit") ---
  app_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.app_identifier }}
      name: ${{ inputs.app_identifier }}
      platform: ${{ inputs.platform }}
  nse_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.nse_identifier }}
      name: ${{ inputs.nse_identifier }}
      platform: ${{ inputs.platform }}
  widgets_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.widgets_identifier }}
      name: ${{ inputs.widgets_identifier }}
      platform: ${{ inputs.platform }}

  # --- Host-identifier-only API capabilities (decision (c)): each binds
  # `identifier` from `steps.app_id.identifier`, never from the input, so
  # the data edge orders it after registration ---
  healthkit:
    tool: appstore.bundle_id_capability.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: HEALTHKIT
  push:
    tool: appstore.bundle_id_capability.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: PUSH_NOTIFICATIONS
  data_protection:
    tool: appstore.bundle_id_capability.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
      capability: DATA_PROTECTION
      setting: ${{ inputs.data_protection }}

  # --- M1: the app record gate, a leaf. Bound from app_id's own output, so
  # it is read after the identifier that names it is known, but nothing
  # downstream depends on this gate's own output. ---
  app_record:
    tool: appstore.app.get
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}

  # --- M2: one APP_GROUPS gate per identifier. Each passes `identifier`
  # through -- the profile nodes below bind from these, never from
  # app_id/nse_id/widgets_id directly (decision (j), point 2). ---
  app_app_groups:
    tool: appstore.app_group.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_id.identifier }}
  nse_app_groups:
    tool: appstore.app_group.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.nse_id.identifier }}
  widgets_app_groups:
    tool: appstore.app_group.gate
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.widgets_id.identifier }}

  # --- The distribution certificate every profile below is signed with
  # (never a literal id -- milestone 3c's own convention) ---
  certificate:
    tool: appstore.certificate.get
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      certificate_type: ${{ inputs.certificate_type }}
      serial_number: ${{ inputs.serial_number }}

  # --- The three App Store profiles, named after their identifiers
  # (decision (h)'s "bundle id everywhere" convention, through the
  # AppleBundleIdentifier => AppleProfileName conversion), each behind its
  # own app-group gate above (operator decision 1: appstore.profile.ensure
  # replaces a profile Apple invalidated). ---
  app_profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.app_app_groups.identifier }}
      name: ${{ steps.app_app_groups.identifier }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}
  nse_profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.nse_app_groups.identifier }}
      name: ${{ steps.nse_app_groups.identifier }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}
  widgets_profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ steps.widgets_app_groups.identifier }}
      name: ${{ steps.widgets_app_groups.identifier }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}

  # --- Doppler: project walter, plain dev/stg/prd root configs (no
  # inheritance), plus prd_config: the operator's real layout (decision 2,
  # task B1) -- a single named branch config, prd_deployment_ios, under
  # environment prd, created by doppler.branch_config.ensure and inheriting
  # the three base configs below. The three doppler.secret.set nodes bind
  # their own `config` from prd_config's own output, since that port only
  # ever binds a derived, non-pure node's output. ---
  names:
    tool: naming.v1
    with:
      org: Bande-a-Bonnot
      slug: walter
  doppler:
    tool: doppler.project.ensure
    with:
      project: ${{ steps.names.doppler_project }}
  configs:
    tool: doppler.config.ensure
    for_each: ${{ inputs.environments }}
    with:
      project: ${{ steps.doppler.project }}
      environment: ${{ item }}
  prd_config:
    tool: doppler.branch_config.ensure
    with:
      project: ${{ steps.doppler.project }}
      environment: prd
      branch: deployment_ios
  # --- D1: one gate per base config, ahead of the inheritance. Missing
  # or non-inheritable blocks at plan time instead of `inherit` failing
  # mid-apply (R3's own carried-forward "remaining", now wired in). Each
  # instance passes `config` through as its own output; `inherit.inherits`
  # binds the *aggregate* of all three instances (a `Step` binding over a
  # `for_each` gate node -- decision (j), point 3), which is itself
  # skipped when any one instance is blocked, so `inherit` is Skip
  # whenever any base config is missing or not inheritable. ---
  base_config_gate:
    tool: doppler.config.inheritable.gate
    for_each: ${{ inputs.base_configs }}
    with:
      config: ${{ item }}
  inherit:
    tool: doppler.config.inherits.ensure
    with:
      config: ${{ steps.prd_config.config }}
      inherits: ${{ steps.base_config_gate.config }}

  # --- The three profiles' content, into Doppler ---
  app_profile_to_doppler:
    tool: doppler.secret.set
    with:
      config: ${{ steps.prd_config.config }}
      name: APP_STORE_PROFILE_APP
      value: ${{ steps.app_profile.content }}
  nse_profile_to_doppler:
    tool: doppler.secret.set
    with:
      config: ${{ steps.prd_config.config }}
      name: APP_STORE_PROFILE_NSE
      value: ${{ steps.nse_profile.content }}
  widgets_profile_to_doppler:
    tool: doppler.secret.set
    with:
      config: ${{ steps.prd_config.config }}
      name: APP_STORE_PROFILE_WIDGETS
      value: ${{ steps.widgets_profile.content }}

  # --- The monorepo, referenced, and the Buildkite pipeline (decisions (f)
  # and (g)). The GitHub token is resolved from Doppler (R4), mirroring
  # R2's workflows/github-repo-token-from-doppler.yaml exactly:
  # gh_token_secret into gh_token, bound to monorepo_ref's own optional
  # `token` port. ---
  gh_token_secret:
    tool: doppler.secret.get
    with:
      config: github/bande-a-bonnot
      name: GH_CLONE_TOKEN
  gh_token:
    tool: github.token.parse
    with:
      value: ${{ steps.gh_token_secret.value }}
  monorepo_ref:
    tool: github.repo.get
    with:
      repo: Bande-a-Bonnot/monorepo
      token: ${{ steps.gh_token.value }}
  # --- D2: the Buildkite token, resolved from Doppler the same way, and
  # `buildkite_org`/`cluster` as bare literals (this document's header). ---
  bk_token_secret:
    tool: doppler.secret.get
    with:
      config: buildkite/prd
      name: PIPELINE_CREATION_TOKEN
  bk_token:
    tool: buildkite.token.parse
    with:
      value: ${{ steps.bk_token_secret.value }}
  buildkite_cluster:
    tool: buildkite.cluster.get
    with:
      org: la-bande-a-bonnot
      name: Default cluster
      token: ${{ steps.bk_token.value }}
  pipeline:
    tool: buildkite.pipeline.ensure
    with:
      org: la-bande-a-bonnot
      slug: ${{ steps.names.buildkite_pipeline_slug }}
      repo: ${{ steps.monorepo_ref.repo }}
      cluster: ${{ steps.buildkite_cluster.cluster }}
      token: ${{ steps.bk_token.value }}

  # --- The four steps that stay reported only: no API exposes their
  # state, so each waits for the operator's own acknowledgement ---
  m3_repo_files:
    tool: operator.acknowledge
    with:
      step: "Add Walter's files under apps/walter/ in the monorepo: BUILD.bazel (ios_application embedding two ios_extensions), three entitlements files, Info.plist with both HealthKit usage strings and the two extension points, and .buildkite/ with provider triggers disabled."
      acknowledged: ${{ inputs.m3_repo_files_done }}
  m5_apns_key:
    tool: operator.acknowledge
    with:
      step: "Confirm the team's APNs auth key (.p8) is in a shared base config Walter inherits; if none exists, create one in the portal (Account Holder or Admin; downloadable once)."
      acknowledged: ${{ inputs.m5_apns_key_done }}
  m6_ci_doppler_access:
    tool: operator.acknowledge
    with:
      step: "Grant the Buildkite CI Doppler service account read access to project walter."
      acknowledged: ${{ inputs.m6_ci_doppler_access_done }}
  m7_bootstrap:
    tool: operator.acknowledge
    with:
      step: "Replace the walter pipeline's stored bootstrap with apps/walter/.buildkite/bootstrap.yml, read it back and compare; keep provider triggers disabled until validated."
      acknowledged: ${{ inputs.m7_bootstrap_done }}
outputs:
  app_id: ${{ steps.app_id.id }}
  nse_id: ${{ steps.nse_id.id }}
  widgets_id: ${{ steps.widgets_id.id }}
  app_identifier: ${{ steps.app_id.identifier }}
  nse_identifier: ${{ steps.nse_id.identifier }}
  widgets_identifier: ${{ steps.widgets_id.identifier }}
  pipeline_url: ${{ steps.pipeline.url }}
