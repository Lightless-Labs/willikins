# Milestone 2b, task C1, decisions (d4) and (d5), acceptance 5
# (docs/plans/2026-10-05-milestone-2b-composition.md): a child declaring
# a secret input that the parent binds to a secret step output of the
# same type must never reach `plan` -- trust boundary 3. Pinned by
# `a_secret_typed_child_input_gives_secret_workflow_input_and_never_reaches_plan`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# child `uses-secret-input-child.yaml`. Linking succeeds; `check` against
# the fake catalog must fail with exactly:
#   CheckError::SecretWorkflowInput {
#       input: InputName("child/token"),
#       ty: TypeRef(DopplerSecretValue),
#   }
name: uses-secret-input
steps:
  secret:
    tool: doppler.secret.get
    with:
      config: example-org/prd
      name: EXAMPLE_SECRET
  child:
    uses: uses-secret-input-child
    with:
      token: ${{ steps.secret.value }}
