# children too-deep-1.yaml..too-deep-8.yaml. Linking must fail with
# exactly:
#   CheckError::UsesTooDeep {
#       chain: [
#           WorkflowName("too-deep-root"), WorkflowName("too-deep-1"),
#           WorkflowName("too-deep-2"), WorkflowName("too-deep-3"),
#           WorkflowName("too-deep-4"), WorkflowName("too-deep-5"),
#           WorkflowName("too-deep-6"), WorkflowName("too-deep-7"),
#           WorkflowName("too-deep-8"),
#       ],
#   }
