# Milestone 2b, task C1, decision (d4) and acceptance 5
# (docs/plans/2026-10-05-milestone-2b-composition.md): a parent binding a
# `GitHubRepo` step output to a child's `DopplerProject` input -- no
# registered conversion exists between the two at all. Pinned by
# `a_github_repo_output_bound_to_a_doppler_project_input_gives_uses_input_type_mismatch`
# (crates/willikins-dsl/tests/it/composition.rs), together with its child
# `uses-input-type-mismatch-child.yaml`. Linking succeeds; `check` against
# the fake catalog must fail with exactly:
#   CheckError::UsesInputTypeMismatch {
#       node: NodeName("child"),
#       input: InputName("project"),
#       expected: TypeRef(DopplerProject),
#       found: TypeRef(GitHubRepo),
#   }
name: uses-input-type-mismatch-root
steps:
  repo:
    tool: github.repo.get
    with:
      repo: example-org/example-repo
  child:
    uses: uses-input-type-mismatch-child
    with:
      project: ${{ steps.repo.repo }}
