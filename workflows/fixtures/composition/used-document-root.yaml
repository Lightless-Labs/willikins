# Milestone 2b, decision (d9) and acceptance 4
# (docs/plans/2026-10-05-milestone-2b-composition.md): a `uses:` step
# whose target exists but fails to parse is refused as UsedDocument,
# naming the child. Pinned by
# `a_child_that_fails_to_parse_is_refused_as_used_document`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# child `used-document-child.yaml` (deliberately malformed). Linking
# must fail with exactly one CheckError::UsedDocument { node, workflow,
# reason } naming node "child" and workflow "used-document-child".
name: used-document-root
steps:
  child:
    uses: used-document-child
