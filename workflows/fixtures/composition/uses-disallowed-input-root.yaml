# Milestone 2b, task C1, decision (d4) and acceptance 5
# (docs/plans/2026-10-05-milestone-2b-composition.md): a child declaring
# `TemplateSource` gives `DisallowedInputType`, bound or not -- the
# literal the parent supplies here never even gets parsed, because the
# declared shape is already the root cause. Pinned by
# `a_child_declaring_template_source_gives_disallowed_input_type`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# child `uses-disallowed-input-child.yaml`. Linking succeeds; `check`
# against the fake catalog must fail with exactly:
#   CheckError::DisallowedInputType {
#       input: InputName("child/template"),
#       ty: TypeRef(TemplateSource),
#   }
name: uses-disallowed-input-root
steps:
  child:
    uses: uses-disallowed-input-child
    with:
      template: ignored
