# Milestone 2b, task K1 (acceptance 11)
# (docs/plans/2026-10-05-milestone-2b-composition.md): a minimal
# organisation document, `new-rust-service-in-org.yaml`'s sibling and only
# `uses:` child. It holds the Buildkite org/cluster lookup, so the only
# Buildkite node in the whole linked graph lives *inside* this used
# document -- the shape acceptance 11's final clause needs: "a root whose
# only Buildkite node is inside the child still requires the Buildkite
# token" for `apply --live`. Modelled on decision (o1)'s sketch, trimmed to
# what this CLI test needs.
name: example-org
description: A minimal organisation document, used only by milestone 2b's CLI acceptance test (task K1).
inputs:
  buildkite_org: { type: BuildkiteOrg, default: example-bk-org }
  cluster_name: { type: BuildkiteClusterName, default: Default cluster }
steps:
  buildkite_cluster:
    tool: buildkite.cluster.get
    with:
      org: ${{ inputs.buildkite_org }}
      name: ${{ inputs.cluster_name }}
outputs:
  buildkite_org: ${{ inputs.buildkite_org }}
  cluster: ${{ steps.buildkite_cluster.cluster }}
