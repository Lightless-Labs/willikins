# Milestone 2b, task K1 (acceptance 11), shaped to the exact signature
# task F1's own row reserves for it ("defaulted `github_org`,
# `buildkite_org`, `cluster`, `environments`; the cluster lookup;
# pass-through outputs") so F1 can build its equivalence test
# (acceptance 12, comparing against `workflows/new-rust-service-
# buildkite.yaml`) on top of this pair without rewriting it.
# `new-rust-service-in-org.yaml`'s sibling and only `uses:` child: every
# organisation-level fact that document's buildkite twin carries as its
# own input or literal lives here instead, as a defaulted input the root
# never has to supply.
name: example-org
description: What the organisation owns for a new Rust service -- the GitHub org, the Buildkite org and cluster, and the environment list every project provisions.
inputs:
  github_org: { type: GitHubOrg, default: Example-Org }
  buildkite_org: { type: BuildkiteOrg, default: example-bk-org }
  cluster: { type: BuildkiteClusterName, default: Default cluster }
  environments: { type: list<EnvironmentSlug>, default: [dev, stg, prd] }
steps:
  buildkite_cluster:
    tool: buildkite.cluster.get
    with:
      org: ${{ inputs.buildkite_org }}
      name: ${{ inputs.cluster }}
outputs:
  github_org: ${{ inputs.github_org }}
  buildkite_org: ${{ inputs.buildkite_org }}
  cluster: ${{ steps.buildkite_cluster.cluster }}
  environments: ${{ inputs.environments }}
