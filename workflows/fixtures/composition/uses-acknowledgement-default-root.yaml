# Milestone 2b, task C1, decision (d4) and acceptance 5
# (docs/plans/2026-10-05-milestone-2b-composition.md): a child's
# defaulted acknowledgement gives `AcknowledgementDefault`, reported
# under the combined `<uses step>/<child input>` name. Pinned by
# `a_child_declaring_a_defaulted_acknowledgement_gives_acknowledgement_default`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# child `uses-acknowledgement-default-child.yaml`. Linking succeeds;
# `check` against the fake catalog must fail with exactly:
#   CheckError::AcknowledgementDefault {
#       input: InputName("child/ack"),
#   }
name: uses-acknowledgement-default-root
inputs:
  m_done: { type: OperatorAcknowledgement }
steps:
  child:
    uses: uses-acknowledgement-default-child
    with:
      ack: ${{ inputs.m_done }}
