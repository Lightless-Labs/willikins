# Milestone 2b, task K1 (acceptance 11). The CLI acceptance test's
# composite root, and (per the SHARED VALUES table's "Public positive
# pair (F1)" row) one half of the pair task F1 compares against
# `workflows/new-rust-service-buildkite.yaml`: same node set (`names`,
# `repo`, `doppler`, `configs[dev/stg/prd]`, a Buildkite cluster lookup,
# `pipeline`), with every organisation-level fact that document carries
# as its own input instead supplied by `uses: example-org` (its sibling
# in this directory, trust boundary 1).
#
# `describe`, `plan` and `apply <file>` must link `example-org` before
# `check` ever sees this document -- a non-empty `uses:` reaching `check`
# unlinked is `CheckError::Unlinked`. The organisation's cluster lookup
# lands in the *linked* graph as `org/buildkite_cluster`, declared before
# this root's own `pipeline` node (which also calls a Buildkite tool, but
# is declared later): `apply --live`'s credential scan, walking nodes in
# that linked order, must reach `org/buildkite_cluster` -- and so
# `WILLIKINS_BUILDKITE_TOKEN` -- through the *used document*, not merely
# because this root's own `pipeline` node would have demanded it anyway.
name: new-rust-service-in-org
description: Provision a GitHub repository, a Doppler project, and a Buildkite pipeline for a Rust service, composed from the organisation document.
inputs:
  slug: { type: ProjectSlug, description: Canonical project slug }
  visibility: { type: RepoVisibility, default: private }
steps:
  org:
    uses: example-org
  names:
    tool: naming.v1
    with:
      org: ${{ steps.org.github_org }}
      slug: ${{ inputs.slug }}
  repo:
    tool: github.repo.ensure
    with:
      repo: ${{ steps.names.github_repo }}
      visibility: ${{ inputs.visibility }}
  doppler:
    tool: doppler.project.ensure
    with:
      project: ${{ steps.names.doppler_project }}
  configs:
    tool: doppler.config.ensure
    for_each: ${{ steps.org.environments }}
    with:
      project: ${{ steps.doppler.project }}
      environment: ${{ item }}
  pipeline:
    tool: buildkite.pipeline.ensure
    with:
      org: ${{ steps.org.buildkite_org }}
      slug: ${{ steps.names.buildkite_pipeline_slug }}
      repo: ${{ steps.repo.repo }}
      cluster: ${{ steps.org.cluster }}
outputs:
  repo_url: ${{ steps.repo.url }}
  pipeline_url: ${{ steps.pipeline.url }}
