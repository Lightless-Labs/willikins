# Milestone 2b, decision (d7) and acceptance 4
# (docs/plans/2026-10-05-milestone-2b-composition.md): a reference to a
# used document's output it never declared is refused as
# UnknownUsesOutput. Pinned by
# `an_unknown_uses_output_reference_is_refused`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# child `unknown-uses-output-child.yaml` (which declares no outputs).
# Linking must fail with exactly:
#   CheckError::UnknownUsesOutput {
#       site: Site::Output { name: OutputName("x") },
#       node: NodeName("child"),
#       output: OutputName("missing"),
#   }
name: unknown-uses-output-root
steps:
  child:
    uses: unknown-uses-output-child
outputs:
  x: ${{ steps.child.missing }}
