# Milestone 2b, decision (d9) and acceptance 4
# (docs/plans/2026-10-05-milestone-2b-composition.md): a `uses:` step
# naming a workflow absent from the trusted directory is refused as
# UnknownWorkflow. Pinned by
# `an_unknown_child_is_refused_as_unknown_workflow`
# (crates/willikins-dsl/tests/it/composition.rs). Linking must fail with
# exactly:
#   CheckError::UnknownWorkflow {
#       node: NodeName("child"),
#       workflow: WorkflowName("ghost-child"),
#   }
name: unknown-child
steps:
  child:
    uses: ghost-child
