# Milestone 2b, decision (d4) and acceptance 4
# (docs/plans/2026-10-05-milestone-2b-composition.md): a `uses:` step's
# `with:` naming an input the used document never declared is refused
# as UnknownUsesInput. Pinned by
# `an_unknown_with_key_is_refused_as_unknown_uses_input`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# child `unknown-uses-input-child.yaml` (which declares only `known`).
# Linking must fail with exactly:
#   CheckError::UnknownUsesInput {
#       node: NodeName("child"),
#       input: InputName("mystery"),
#   }
name: unknown-uses-input-root
steps:
  child:
    uses: unknown-uses-input-child
    with:
      mystery: x
