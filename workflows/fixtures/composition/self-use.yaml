# (docs/plans/2026-10-05-milestone-2b-composition.md): the linker refuses
# a `uses:` step naming its own document as a one-entry cycle (a
# self-use). Pinned by `a_self_use_is_refused_as_uses_cycle`
# (crates/willikins-dsl/tests/it/composition.rs). Linking must fail with
# exactly:
#   CheckError::UsesCycle {
