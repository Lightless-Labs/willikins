# Milestone 2b, decision (d7) and acceptance 4
# (docs/plans/2026-10-05-milestone-2b-composition.md): the same "inside
# another `uses:` step's `with:`" site as
# nested-site-unknown-uses-output-root.yaml, for KeyedOnUses. Pinned by
# `a_keyed_reference_from_inside_another_uses_steps_with_is_sited_there`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# shared children `nested-site-achild.yaml` and
# `nested-site-bchild.yaml`. Linking must fail with exactly:
#   CheckError::KeyedOnUses {
#       site: Site::Port { node: NodeName("a"), port: PortName("x") },
#       node: NodeName("b"),
#   }
name: nested-site-keyed-on-uses-root
steps:
  a:
    uses: nested-site-achild
    with:
      x: ${{ steps.b[k].out }}
  b:
    uses: nested-site-bchild
