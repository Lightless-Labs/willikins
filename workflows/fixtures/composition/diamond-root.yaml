# Milestone 2b, decision (d9) and acceptance 4
# (docs/plans/2026-10-05-milestone-2b-composition.md): a diamond whose full
# expansion (9 * 9 * 9 * 3 = 2187 nodes) exceeds MAX_LINKED_NODES (2048) is
# refused as UsesTooLarge, raised while the running count is still below
# double the bound -- before the whole diamond is materialised. Pinned by
# `a_diamond_over_the_node_bound_is_refused_as_uses_too_large`
# (crates/willikins-dsl/tests/it/composition.rs), together with its
# children diamond-mid2.yaml, diamond-mid1.yaml, diamond-leaf.yaml. Linking
# must fail with exactly one CheckError::UsesTooLarge { nodes } with
# nodes > 2048.
name: diamond-root
steps:
  u0:
    uses: diamond-mid2
  u1:
    uses: diamond-mid2
  u2:
    uses: diamond-mid2
  u3:
    uses: diamond-mid2
  u4:
    uses: diamond-mid2
  u5:
    uses: diamond-mid2
  u6:
    uses: diamond-mid2
  u7:
    uses: diamond-mid2
  u8:
    uses: diamond-mid2
