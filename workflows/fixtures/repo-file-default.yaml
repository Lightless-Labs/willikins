# Milestone 3g, decision (e) and acceptance 4
# (docs/plans/2026-09-30-milestone-3g-file-writing.md): a repository file
# declared as a workflow input with a default. Pinned by
# `template_source_or_repo_file_inputs_and_defaults_each_fail_check_with_exactly_one_error`
# (crates/willikins-dsl/tests/acceptance.rs). `check` must return exactly one
# error:
#   DisallowedInputType { input: file, ty: RepoFile }
name: repo-file-default
description: A repository file declared as a workflow input with a default.
inputs:
  repo: { type: GitHubRepo, description: "The repository to scaffold" }
  file: { type: RepoFile, default: "app/BUILD.bazel\n# reserved\n", description: "A defaulted file" }
steps:
  scaffold:
    tool: github.scaffold.ensure
    with:
      repo: ${{ inputs.repo }}
      branch: main
      marker: app/.willikins-scaffold
      files:
        - ${{ inputs.file }}
      message: "feat(app): scaffold"
