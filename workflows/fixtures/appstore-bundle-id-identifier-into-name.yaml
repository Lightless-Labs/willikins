# Negative fixture. Milestone 3e task T3f removes the
# `AppleBundleIdentifier => AppleBundleIdName` conversion milestone 3e task
# T3b (decision (h)) registered: a live probe against the operator's real
# App Store Connect account found Apple refuses a dot, an apostrophe, or
# an ampersand in a bundle id's `name` attribute (409
# ENTITY_ERROR.ATTRIBUTE.INVALID), though every `AppleBundleIdentifier`'s
# own grammar admits a dot -- so the row was never total against Apple's
# real rule (CLAUDE.md's conversions invariant: "only from a total `From`
# impl"). Binding an `AppleBundleIdentifier` to
# `appstore.bundle_id.ensure`'s `name` port now fails `check` exactly as
# it did before that conversion ever existed. Acceptance test:
# `appstore_bundle_id_identifier_into_name_is_rejected` in
# `crates/willikins-providers-appstore/tests/bundle_id_documents.rs`.
# `check` returns exactly one error:
#   TypeMismatch { node: bundle_id, port: name, expected: Exact(AppleBundleIdName), found: AppleBundleIdentifier }
name: appstore-bundle-id-identifier-into-name
description: appstore.bundle_id.ensure's name port bound to an AppleBundleIdentifier, the removed conversion's own direction.
inputs:
  config: { type: DopplerConfig }
  identifier: { type: AppleBundleIdentifier }
  platform: { type: AppleBundleIdPlatform }
steps:
  issuer_id_text:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_ISSUER_ID
  issuer_id:
    tool: apple.issuer_id.parse
    with:
      value: ${{ steps.issuer_id_text.value }}
  key_id_text:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_ID
  key_id:
    tool: apple.key_id.parse
    with:
      value: ${{ steps.key_id_text.value }}
  key_base64:
    tool: doppler.secret.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_BASE64
  key_decoded:
    tool: base64.decode
    with:
      value: ${{ steps.key_base64.value }}
  key:
    tool: apple.signing_key.parse
    with:
      value: ${{ steps.key_decoded.value }}
  bundle_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.identifier }}
      name: ${{ inputs.identifier }}
      platform: ${{ inputs.platform }}
