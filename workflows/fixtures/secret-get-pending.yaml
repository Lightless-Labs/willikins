# Task 10b adversarial pass (`crates/willikins-server/tests/adversarial_10b.rs`,
# `the_approvals_page_shows_a_seeded_secret_only_as_its_marker`):
# `secret-get.yaml`'s own seeded-secret flow, plus one irreversible step
# so the plan actually waits on a human and can therefore be rendered by
# `GET /approvals`. `secret-get.yaml` itself is `Class::Reversible`, so
# it auto-approves and no human ever sees its plan; this fixture is the
# only way to put a `Known` secret value in front of the approvals page
# at all. The page must show the redaction marker and never the seeded
# bytes.
name: secret-get-pending
description: A seeded Doppler secret inside a plan that waits on a human decision.
inputs:
  project: { type: DopplerProject }
  slug: { type: ProjectSlug }
steps:
  config:
    tool: doppler.config.ensure
    with:
      project: ${{ inputs.project }}
      environment: prd
  secret:
    tool: doppler.secret.get
    with:
      config: ${{ steps.config.config }}
      name: DATABASE_URL
  ci_secret:
    tool: github.actions_secret.ensure
    with:
      repo: lightless-labs/third-thoughts
      name: DOPPLER_TOKEN
      value: ${{ steps.secret.value }}
  danger:
    tool: fake.irreversible.ensure
    with:
      key: ${{ inputs.slug }}
