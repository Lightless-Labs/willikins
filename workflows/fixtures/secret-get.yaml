# Acceptance test 8b: doppler.secret.get's known secret value flows
# straight into github.actions_secret.ensure's secret-accepting `value`
# port. `check` accepts this (secret to secret sink, unlike test 1's
# secret-into-template.yaml). With the value seeded in fake state, `plan`
# must carry it as a `Known` DopplerSecretValue and never print the seeded
# bytes, in either JSON or CLI text output.
name: secret-get
description: A seeded Doppler secret flows into a GitHub Actions secret.
inputs:
  project: { type: DopplerProject }
steps:
  config:
    tool: doppler.config.ensure
    with:
      project: ${{ inputs.project }}
      environment: prd
  secret:
    tool: doppler.secret.get
    with:
      config: ${{ steps.config.config }}
      name: DATABASE_URL
  ci_secret:
    tool: github.actions_secret.ensure
    with:
      repo: lightless-labs/third-thoughts
      name: DOPPLER_TOKEN
      value: ${{ steps.secret.value }}
