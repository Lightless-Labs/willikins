# Acceptance test 2: a workflow input declared with a secret type must be
# rejected. `check` returns exactly one error:
#   SecretWorkflowInput { input: token, ty: DopplerServiceToken }
name: secret-input
description: A workflow input declared with a secret type.
inputs:
  token: { type: DopplerServiceToken }
steps:
  names:
    tool: naming.v1
    with:
      org: lightless-labs
      slug: third-thoughts
