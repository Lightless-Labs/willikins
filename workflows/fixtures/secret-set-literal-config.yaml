# Negative fixture. Acceptance test: `underived_config_binding_is_refused`
# (crates/willikins-providers-doppler/tests/secret_set_provenance.rs).
# `check` returns exactly one error:
#   UnderivedBinding { node: sink, port: config }
#
# `doppler.secret.set`'s `config` port may only be bound to the output of
# an earlier, non-pure node -- never a literal, a workflow input, or a
# pure node's output -- so a document may write a secret only into a
# config the same graph actually produced, never one it names by fiat.
# See `crates/willikins-providers-doppler/src/tools/secret_set.rs`'s
# module docs for the full provenance argument this fixture pins.
name: secret-set-literal-config
description: doppler.secret.set's config port bound to a literal instead of a derived node's output.
steps:
  source:
    tool: doppler.secret.get
    with:
      config: third-thoughts/prd
      name: DATABASE_URL
  sink:
    tool: doppler.secret.set
    with:
      config: third-thoughts/stg
      name: MIRRORED_URL
      value: ${{ steps.source.value }}
