# Negative fixture. Milestone 3d registers exactly one conversion,
# `AppleBundleIdentifier => AppleProfileName`: every bundle identifier is a
# valid profile name, so a `name` port also accepts an identifier. The
# reverse is not a fact -- `has space` is a profile name and not a bundle
# identifier -- so no reverse row exists, and binding an `AppleProfileName`
# to `appstore.profile.ensure`'s `identifier` port still fails `check`
# exactly as it did before conversions existed. It pins that the one
# conversion runs one way only (`docs/plans/2026-09-23-milestone-3d-conversions.md`,
# decision (i)). Acceptance test:
# `appstore_profile_name_into_identifier_is_rejected` in
# `crates/willikins-providers-appstore/tests/profile_documents.rs`.
# `check` returns exactly one error:
#   TypeMismatch { node: profile, port: identifier, expected: Exact(AppleBundleIdentifier), found: AppleProfileName }
name: appstore-profile-name-into-identifier
description: appstore.profile.ensure's identifier port bound to an AppleProfileName, the one conversion's reverse direction.
inputs:
  config: { type: DopplerConfig }
  profile_name: { type: AppleProfileName }
  certificate_type: { type: AppleCertificateType }
  serial_number: { type: AppleCertificateSerial }
steps:
  issuer_id_text:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: APP_STORE_CONNECT_API_KEY_ISSUER_ID
  issuer_id:
    tool: apple.issuer_id.parse
    with:
      value: ${{ steps.issuer_id_text.value }}
  key_id_text:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: APP_STORE_CONNECT_API_KEY_ID
  key_id:
    tool: apple.key_id.parse
    with:
      value: ${{ steps.key_id_text.value }}
  key_base64:
    tool: doppler.secret.get
    with:
      config: ${{ inputs.config }}
      name: APP_STORE_CONNECT_API_KEY_BASE64
  key_decoded:
    tool: base64.decode
    with:
      value: ${{ steps.key_base64.value }}
  key:
    tool: apple.signing_key.parse
    with:
      value: ${{ steps.key_decoded.value }}
  certificate:
    tool: appstore.certificate.get
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      certificate_type: ${{ inputs.certificate_type }}
      serial_number: ${{ inputs.serial_number }}
  profile:
    tool: appstore.profile.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.profile_name }}
      name: ${{ inputs.profile_name }}
      profile_type: IOS_APP_STORE
      certificate: ${{ steps.certificate.certificate }}
