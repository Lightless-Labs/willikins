# Milestone 3a acceptance: a type mismatch between a Doppler port and a
# Buildkite port -- doppler.project.ensure's `project` output
# (DopplerProject) bound to buildkite.pipeline.ensure's `cluster` port
# (BuildkiteClusterId). `check` must return exactly one error:
#   TypeMismatch { node: pipeline, port: cluster,
#                  expected: Exact(BuildkiteClusterId), found: DopplerProject }
name: buildkite-doppler-type-mismatch
description: A DopplerProject bound to a port that expects a BuildkiteClusterId.
inputs:
  project: { type: DopplerProject }
steps:
  doppler:
    tool: doppler.project.ensure
    with:
      project: ${{ inputs.project }}
  pipeline:
    tool: buildkite.pipeline.ensure
    with:
      org: willikins-test
      slug: third-thoughts
      repo: lightless-labs/third-thoughts
      cluster: ${{ steps.doppler.project }}
