# Acceptance test 4: a `${{ steps.<node>[<key>].<port> }}` reference to a
# node with no `for_each`. `check` returns exactly one error:
#   KeyedOnScalarNode { site: Site::Port { node: token, port: config },
#                       referenced: doppler }
name: keyed-on-scalar-node
description: A keyed reference to a node that never runs per item.
steps:
  doppler:
    tool: doppler.project.ensure
    with:
      project: third-thoughts
  token:
    tool: doppler.service_token.ensure
    with:
      config: ${{ steps.doppler[prd].project }}
      name: ci
