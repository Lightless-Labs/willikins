# Negative fixture. Milestone 3e (task T3b) registered a
# `AppleBundleIdentifier => Text` conversion row (a second row, `=>
# AppleBundleIdName`, was removed again by task T3f: it was never total
# against Apple's real rule for a bundle id's `name`). The `=> Text` row
# runs one way only -- `Text` accepts the empty string and any character
# at all, so the reverse is not a fact, and binding a `Text` to
# `appstore.bundle_id.ensure`'s `identifier` port still fails `check`
# exactly as it did before this conversion existed. It pins that a new
# conversion loosens `check` only along its own registered edge, never the
# reverse (`docs/plans/2026-09-27-milestone-3e-new-ios-app.md`, task T3b).
# Acceptance test: `appstore_bundle_id_text_into_identifier_is_rejected` in
# `crates/willikins-providers-appstore/tests/bundle_id_documents.rs`.
# `check` returns exactly one error:
#   TypeMismatch { node: bundle_id, port: identifier, expected: Exact(AppleBundleIdentifier), found: Text }
name: appstore-bundle-id-text-into-identifier
description: appstore.bundle_id.ensure's identifier port bound to a Text, the new conversions' reverse direction.
inputs:
  config: { type: DopplerConfig }
  identifier_text: { type: Text }
  name: { type: AppleBundleIdName }
  platform: { type: AppleBundleIdPlatform }
steps:
  issuer_id_text:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_ISSUER_ID
  issuer_id:
    tool: apple.issuer_id.parse
    with:
      value: ${{ steps.issuer_id_text.value }}
  key_id_text:
    tool: doppler.value.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_ID
  key_id:
    tool: apple.key_id.parse
    with:
      value: ${{ steps.key_id_text.value }}
  key_base64:
    tool: doppler.secret.get
    with:
      config: ${{ inputs.config }}
      name: ASC_API_KEY_BASE64
  key_decoded:
    tool: base64.decode
    with:
      value: ${{ steps.key_base64.value }}
  key:
    tool: apple.signing_key.parse
    with:
      value: ${{ steps.key_decoded.value }}
  bundle_id:
    tool: appstore.bundle_id.ensure
    with:
      issuer_id: ${{ steps.issuer_id.value }}
      key_id: ${{ steps.key_id.value }}
      key: ${{ steps.key.value }}
      identifier: ${{ inputs.identifier_text }}
      name: ${{ inputs.name }}
      platform: ${{ inputs.platform }}
