# Negative fixture: a secret output bound to a non-secret sink.
# `check` must reject this with exactly one SecretToNonSecretSink error
# naming steps.token.token and steps.readme.content.
name: secret-into-template
inputs:
  slug: { type: ProjectSlug }
steps:
  doppler:
    tool: doppler.project.ensure
    with:
      name: ${{ inputs.slug }}
  config:
    tool: doppler.config.ensure
    with:
      project: ${{ steps.doppler.project }}
      name: prd
  token:
    tool: doppler.service_token.ensure
    with:
      config: ${{ steps.config.config }}
  readme:
    tool: template.render
    with:
      template: "DOPPLER_TOKEN={{ value }}"
      value: ${{ steps.token.token }}
