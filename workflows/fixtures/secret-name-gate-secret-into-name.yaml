# Negative fixture. Milestone 3j, task C2 (acceptance 11): a Doppler
# secret value, read by `doppler.secret.get`, bound into
# `doppler.secret_name.gate`'s own `name` port -- the gate's `name` input
# is `SecretName`, a non-secret-accepting type, and a secret output with
# an attributable source into a non-secret sink is
# `CheckError::SecretToNonSecretSink`, reported in preference to the
# `TypeMismatch` it also is (`crates/willikins-core/src/check.rs`'s own
# comment on that precedence; same shape as `secret-into-template.yaml`
# and `secret-into-repo-file.yaml`). Acceptance test:
# `secret_name_gate_secret_into_name_fails_check_with_exactly_one_error`
# in `crates/willikins-dsl/tests/acceptance.rs`. `check` returns exactly
# one error:
#   SecretToNonSecretSink { from: (secret, value),
#                          to: Site::Port { node: apns_key, port: name } }
name: secret-name-gate-secret-into-name
description: A Doppler secret value bound into doppler.secret_name.gate's name port.
inputs:
  config: { type: DopplerConfig }
steps:
  secret:
    tool: doppler.secret.get
    with:
      config: ${{ inputs.config }}
      name: EXAMPLE_APNS_KEY
  apns_key:
    tool: doppler.secret_name.gate
    with:
      config: ${{ inputs.config }}
      name: ${{ steps.secret.value }}
