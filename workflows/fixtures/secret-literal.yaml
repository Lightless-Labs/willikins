# Acceptance test 3: a literal bound to a secret-accepting port.
# `check` returns exactly one error:
#   SecretLiteral { node: ci_secret, port: value }
name: secret-literal
description: A secret literal bound to github.actions_secret.ensure's value port.
steps:
  ci_secret:
    tool: github.actions_secret.ensure
    with:
      repo: lightless-labs/third-thoughts
      name: DOPPLER_TOKEN
      value: dp.st.prd.hunter2
