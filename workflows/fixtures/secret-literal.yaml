# Acceptance test 3: a literal bound to a secret-accepting port.
# `check` returns exactly one error:
#   SecretLiteral { node: ci_secret, port: value }
#
# The value's shape does not matter: `check` rejects any literal bound to
# a secret-accepting port before looking at its text, so this is not
# written as a Doppler-token-shaped string (a YAML document cannot build
# one from parts the way the Rust siblings of this fixture do).
name: secret-literal
description: A secret literal bound to github.actions_secret.ensure's value port.
steps:
  ci_secret:
    tool: github.actions_secret.ensure
    with:
      repo: lightless-labs/third-thoughts
      name: DOPPLER_TOKEN
      value: hunter2hunter2hunter2hunter2hunter2hunter2
