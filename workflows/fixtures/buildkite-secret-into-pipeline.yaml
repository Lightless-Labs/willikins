# Milestone 3a acceptance: a secret output bound to a non-secret sink, on
# the Buildkite provider's own `repo` port. `check` must return exactly
# one error:
#   SecretToNonSecretSink { from: (token, token),
#                          to: Site::Port { node: pipeline, port: repo } }
name: buildkite-secret-into-pipeline
description: A Doppler service token bound to buildkite.pipeline.ensure's repo port.
inputs:
  project: { type: DopplerProject }
steps:
  doppler:
    tool: doppler.project.ensure
    with:
      project: ${{ inputs.project }}
  config:
    tool: doppler.config.ensure
    with:
      project: ${{ steps.doppler.project }}
      environment: prd
  token:
    tool: doppler.service_token.ensure
    with:
      config: ${{ steps.config.config }}
      name: ci
  pipeline:
    tool: buildkite.pipeline.ensure
    with:
      org: willikins-test
      slug: third-thoughts
      repo: ${{ steps.token.token }}
      cluster: 018e5a22-d14c-7085-bb28-db0f83f43a1c
