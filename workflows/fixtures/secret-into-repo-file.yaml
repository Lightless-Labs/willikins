# Milestone 3g, decision (e) and acceptance 4
# (docs/plans/2026-09-30-milestone-3g-file-writing.md): a secret read from
# Doppler bound as an element of `repo.file.render`'s `values` list, the one
# route by which a caller-reachable value enters a committed file. Pinned by
# `secret_into_repo_file_fails_check_with_exactly_one_taint_error`
# (crates/willikins-dsl/tests/acceptance.rs). `check` must return exactly one
# error:
#   SecretToNonSecretSink { from: (secret, value),
#                          to: Site::ListElement { node: render, port: values, index: 0 } }
name: secret-into-repo-file
description: A Doppler secret as an element of a rendered repository file's values.
inputs:
  config: { type: DopplerConfig, description: "Doppler config holding the secret" }
steps:
  secret:
    tool: doppler.secret.get
    with:
      config: ${{ inputs.config }}
      name: SOME_SECRET
  render:
    tool: repo.file.render
    with:
      path: apps/walter/BUILD.bazel
      template: "value = \"{{ 0 }}\"\n"
      values:
        - ${{ steps.secret.value }}
