# Acceptance test 4: a `for_each` over a secret-typed list source
# (fake.secret_list's `tokens`, list<DopplerServiceToken>). `check` returns
# exactly one error:
#   SecretForEachSource { node: loop }
name: secret-for-each
description: A for_each over a secret list.
inputs:
  project: { type: DopplerProject }
steps:
  config:
    tool: doppler.config.ensure
    with:
      project: ${{ inputs.project }}
      environment: prd
  list:
    tool: fake.secret_list
    with:
      config: ${{ steps.config.config }}
  loop:
    tool: fake.irreversible.ensure
    for_each: ${{ steps.list.tokens }}
    with:
      key: third-thoughts
