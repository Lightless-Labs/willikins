# Milestone 3o, task E1 (docs/plans/2026-10-06-milestone-3o-agents-md.md,
# SHARED VALUES "Standalone project document (E1)", decisions (d1), (d3)):
# a brand-new, standalone repository (milestone 3l's shape) whose one
# scaffold commit carries both its README and its AGENTS.md, the latter
# rendered entirely by the sibling organisation document `uses:
# example-org-agents-md` -- this document contributes the project's name
# as a token only, never any prose. Pinned by
# `standalone_service_links_and_checks`
# (crates/willikins-cli/tests/it/agents_md_documents.rs).
name: standalone-service
description: Create a standalone repository and scaffold it with a README and an AGENTS.md rendered by the organisation document.
inputs:
  repo:
    type: GitHubRepo
    description: "The repository to create and scaffold"
  project:
    type: TemplateValue
    description: "The project's canonical name, passed through to the organisation's AGENTS.md"
  visibility:
    type: RepoVisibility
    default: private
steps:
  agents_md:
    uses: example-org-agents-md
    with:
      project: ${{ inputs.project }}
  repo:
    tool: github.repo.ensure
    with:
      repo: ${{ inputs.repo }}
      visibility: ${{ inputs.visibility }}
  readme_file:
    tool: repo.file.render
    with:
      path: README.md
      template: "# Scaffolded by willikins\n"
  scaffold:
    tool: github.scaffold.ensure
    with:
      repo: ${{ steps.repo.repo }}
      branch: main
      marker: .willikins-scaffold
      files:
        - ${{ steps.readme_file.file }}
        - ${{ steps.agents_md.file }}
      message: "chore: scaffold the repository"
