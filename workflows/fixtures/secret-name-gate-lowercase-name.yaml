# Negative fixture. Milestone 3j, task C2 (acceptance 11): a lowercase
# literal bound to `doppler.secret_name.gate`'s `name` port fails
# `SecretName`'s grammar (`[A-Z_][A-Z0-9_]*`). Acceptance test:
# `secret_name_gate_lowercase_name_fails_check_with_exactly_one_error` in
# `crates/willikins-dsl/tests/acceptance.rs`. `check` returns exactly one
# error:
#   InvalidLiteral { node: apns_key, port: name, error: { type_name: "SecretName", .. } }
name: secret-name-gate-lowercase-name
description: A lowercase secret name literal bound to doppler.secret_name.gate's name port.
inputs:
  config: { type: DopplerConfig }
steps:
  apns_key:
    tool: doppler.secret_name.gate
    with:
      config: ${{ inputs.config }}
      name: example_apns_key
