# Negative fixture. Acceptance test: `underived_config_binding_is_refused`
# (crates/willikins-providers-doppler/tests/secret_set_provenance.rs),
# the workflow-input half. `check` returns exactly one error:
#   UnderivedBinding { node: sink, port: config }
#
# Same provenance rule as `secret-set-literal-config.yaml`: a workflow
# input is caller-supplied at plan time exactly like a literal is (it is
# journaled the same way, and `check` already refuses a secret-typed
# input for the identical reason), so it is refused here too -- the
# `config` port accepts only the output of an earlier, non-pure node.
name: secret-set-input-config
description: doppler.secret.set's config port bound to a workflow input instead of a derived node's output.
inputs:
  target_config: { type: DopplerConfig }
steps:
  source:
    tool: doppler.secret.get
    with:
      config: third-thoughts/prd
      name: DATABASE_URL
  sink:
    tool: doppler.secret.set
    with:
      config: ${{ inputs.target_config }}
      name: MIRRORED_URL
      value: ${{ steps.source.value }}
