# Acceptance test 3: a `with` key that is not one of the node's tool's
# ports. `check` returns exactly one error:
#   UnknownPort { site: Site::Port { node: names, port: bogus }, tool: naming.v1 }
name: unknown-port
description: An extra `with` key that naming.v1 has no port for.
steps:
  names:
    tool: naming.v1
    with:
      org: lightless-labs
      slug: third-thoughts
      bogus: literal
