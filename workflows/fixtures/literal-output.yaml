# Adversarial pass 2, finding 1: a workflow output bound to a bare literal.
# `check` must return exactly one error:
#   LiteralOutput { output: repo_url }
# Before the fix, `validate` accepted this document and `plan` silently
# omitted `repo_url` from `Plan::outputs`, so the plan misrepresented the
# workflow's own declared surface: an agent reading it saw one output where
# the document declares two.
name: literal-output
description: A workflow output bound to a literal rather than a reference.
steps:
  names:
    tool: naming.v1
    with:
      org: lightless-labs
      slug: demo
outputs:
  repo_url: https://example.com/not-a-reference
  github_repo: ${{ steps.names.github_repo }}
