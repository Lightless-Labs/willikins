# Positive fixture. Acceptance test:
# `a_config_derived_from_an_earlier_non_pure_node_is_accepted`
# (crates/willikins-providers-doppler/tests/secret_set_provenance.rs).
# `doppler.secret.set`'s `config` port bound to the output of an earlier,
# non-pure node (`doppler.config.ensure`) -- the one shape
# `PortSpec::derived_only` accepts. `check` must succeed.
name: secret-set-derived-config
description: doppler.secret.set's config port bound to a real upstream node's output.
inputs:
  project: { type: DopplerProject }
steps:
  config:
    tool: doppler.config.ensure
    with:
      project: ${{ inputs.project }}
      environment: prd
  source:
    tool: doppler.secret.get
    with:
      config: third-thoughts/prd
      name: DATABASE_URL
  sink:
    tool: doppler.secret.set
    with:
      config: ${{ steps.config.config }}
      name: MIRRORED_URL
      value: ${{ steps.source.value }}
